<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Home</title>

<style>
:root{
  --app-height:100dvh;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  position:fixed;
  inset:0;
  color:#fff;
}

button,input,textarea,select{
  font:inherit;
}

button{
  appearance:none;
  -webkit-appearance:none;
}

/* HOME */

#home{
  position:absolute;
  inset:0;
  width:100%;
  height:var(--app-height);
  overflow:hidden;
  background:linear-gradient(160deg,#4c5e79,#26364b 50%,#0d121a);
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#home::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.01),rgba(0,0,0,.02) 65%,rgba(0,0,0,.22));
}

/* SECRET ADMIN */

#adminHotspot{
  position:absolute;
  top:0;
  left:0;
  width:72px;
  height:72px;
  z-index:999;
  background:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

/* PAGES */

.pages{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  top:calc(env(safe-area-inset-top) + 18px);
  bottom:calc(env(safe-area-inset-bottom) + 120px);
  overflow:hidden;
}

.track{
  display:flex;
  width:100%;
  height:100%;
  transition:transform .32s cubic-bezier(.22,.7,.18,1);
}

.page{
  flex:0 0 100%;
  width:100%;
  height:100%;
  padding:22px 18px;
  overflow-y:auto;
  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  column-gap:12px;
  row-gap:23px;
}

/* APP ICON */

.app{
  position:relative;
  min-width:0;
  text-align:center;
  user-select:none;
  -webkit-user-select:none;
}

.app-icon{
  position:relative;
  width:min(17vw,70px);
  height:min(17vw,70px);
  margin:auto;
  overflow:hidden;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;

  background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.28);

  box-shadow:
    0 9px 24px rgba(0,0,0,.23),
    inset 0 1px 1px rgba(255,255,255,.58);

  backdrop-filter:blur(17px) saturate(175%);
  -webkit-backdrop-filter:blur(17px) saturate(175%);
}

.app-icon img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.emoji{
  position:relative;
  z-index:2;
}

.app-name{
  margin-top:6px;
  padding:0 2px;
  font-size:12px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 5px rgba(0,0,0,.8);
}

/* BRAND ICONS */

.brand-icon{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
}

.brand-telegram{
  background:linear-gradient(145deg,#37ace9,#138bce);
  font-size:31px;
}

.brand-instagram{
  background:radial-gradient(circle at 30% 100%,#ffd56b 0 18%,#ff6b65 36%,#c13584 61%,#405de6 100%);
  font-size:30px;
}

.brand-max{
  background:linear-gradient(145deg,#6963ff,#3430dd);
  font-size:27px;
}

/* DOTS */

.dots{
  position:absolute;
  z-index:8;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 101px);
  display:flex;
  justify-content:center;
  gap:7px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(255,255,255,.36);
}

.dot.active{
  background:#fff;
}

/* DOCK */

.dock{
  position:absolute;
  z-index:8;
  left:14px;
  right:14px;
  bottom:max(9px,env(safe-area-inset-bottom));
  height:88px;
  border-radius:29px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  backdrop-filter:blur(27px) saturate(180%);
  -webkit-backdrop-filter:blur(27px) saturate(180%);
}

.dock .app-icon{
  width:61px;
  height:61px;
  border-radius:17px;
}

.dock .app-name{
  display:none;
}

/* EDIT MODE */

.editing .app{
  animation:wiggle .18s infinite alternate;
}

@keyframes wiggle{
  from{transform:rotate(-1deg)}
  to{transform:rotate(1deg)}
}

.delete-app{
  display:none;
  position:absolute;
  left:3px;
  top:-6px;
  z-index:20;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:rgba(35,35,38,.94);
  color:#fff;
  font-size:18px;
}

.editing .delete-app{
  display:block;
}

.edit-done{
  display:none;
  position:absolute;
  z-index:50;
  top:calc(env(safe-area-inset-top) + 8px);
  right:14px;
  height:36px;
  padding:0 17px;
  border:0;
  border-radius:18px;
  background:rgba(255,255,255,.93);
  color:#007aff;
  font-weight:700;
}

.editing .edit-done{
  display:block;
}

/* OVERLAY */

.overlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:1000;
  overflow:auto;
}

.overlay.show{
  display:block;
}

/* SYSTEM SCREEN */

.system-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#f2f2f7;
  color:#111;
}

.system-top{
  min-height:64px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  background:rgba(248,248,250,.97);
  border-bottom:1px solid #d7d7dc;
}

.system-back{
  border:0;
  background:none;
  padding:0;
  color:#007aff;
  font-size:16px;
}

.system-title{
  font-size:21px;
  font-weight:700;
}

.system-body{
  flex:1;
  overflow-y:auto;
  padding:18px 14px calc(env(safe-area-inset-bottom) + 25px);
}

/* SETTINGS */

.settings-group,
.card{
  overflow:hidden;
  margin-bottom:18px;
  border-radius:14px;
  background:#fff;
}

.settings-row,
.list-row{
  min-height:56px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 13px;
  border-bottom:1px solid #ececf0;
}

.settings-row:last-child,
.list-row:last-child{
  border-bottom:0;
}

.settings-icon{
  width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:#6877d7;
  font-size:18px;
}

.settings-main,
.list-main{
  flex:1;
  min-width:0;
}

.settings-small,
.list-sub{
  margin-top:2px;
  color:#89898f;
  font-size:12px;
}

.list-sub{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chevron{
  color:#b1b1b6;
  font-size:22px;
}

/* BUTTONS */

.primary,
.secondary,
.danger{
  width:100%;
  min-height:48px;
  margin-top:10px;
  border:0;
  border-radius:13px;
}

.primary{
  background:#007aff;
  color:#fff;
  font-weight:650;
}

.secondary{
  background:#fff;
  color:#007aff;
}

.danger{
  background:#fff;
  color:#ff3b30;
}

/* FIELDS */

.field{
  width:100%;
  min-height:48px;
  margin-top:10px;
  padding:0 13px;
  border:1px solid #d7d7dc;
  border-radius:13px;
  background:#fff;
  color:#111;
  outline:none;
}

textarea.field{
  height:120px;
  padding-top:12px;
}

select.field{
  appearance:auto;
}

/* AVATAR */

.avatar{
  width:47px;
  height:47px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(145deg,#7c9cff,#735fe5);
  color:#fff;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.list-title{
  font-weight:650;
}

/* WALLPAPERS */

.wallpaper-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.wallpaper{
  position:relative;
  aspect-ratio:9/16;
  overflow:hidden;
  border:2px solid transparent;
  border-radius:14px;
  background-position:center;
  background-size:cover;
}

.wallpaper.selected{
  border-color:#007aff;
}

.wallpaper-delete{
  position:absolute;
  left:5px;
  top:5px;
  width:25px;
  height:25px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
}

/* CHAT LIST */

.msg-list{
  flex:1;
  overflow-y:auto;
  background:#fff;
}

.msg-row{
  min-height:74px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 12px;
  border-bottom:1px solid rgba(0,0,0,.06);
}

.msg-avatar{
  width:55px;
  height:55px;
  flex:0 0 55px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:19px;
  font-weight:700;
  background:linear-gradient(145deg,#86a7e9,#5b77d0);
}

.msg-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.msg-center{
  flex:1;
  min-width:0;
}

.msg-name-row{
  display:flex;
  align-items:center;
  gap:5px;
}

.msg-name{
  flex:1;
  min-width:0;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.msg-last{
  margin-top:4px;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.msg-time{
  font-size:12px;
  white-space:nowrap;
}

.unread{
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:12px;
  font-weight:700;
  margin-left:auto;
  margin-top:5px;
}

.pin{
  font-size:12px;
  opacity:.42;
}

/* TELEGRAM */

.telegram-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  color:#111;
}

.telegram-top{
  min-height:64px;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  background:#fff;
  color:#111;
  border-bottom:1px solid #e9e9ed;
}

.telegram-title{
  flex:1;
  font-size:21px;
  font-weight:700;
  text-align:center;
}

.telegram-action{
  border:0;
  background:none;
  color:#168acd;
  font-size:16px;
  padding:0;
}

.telegram .msg-last{
  color:#85858b;
}

.telegram .msg-time{
  color:#8e8e93;
}

.telegram .unread{
  background:#2aabee;
}

/* MAX */

.max-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#f6f6f8;
  color:#111;
}

.max-top{
  min-height:66px;
  padding:calc(env(safe-area-inset-top) + 9px) 15px 10px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  color:#111;
  background:#f7f7fa;
  border-bottom:1px solid #e5e5eb;
}

.max-logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.max-logo span{
  color:#5552f6;
}

.max-action{
  border:0;
  background:none;
  color:#5552f6;
  font-size:17px;
}

.max .msg-last{
  color:#7f7f86;
}

.max .msg-time{
  color:#99999f;
}

.max .unread{
  background:#5a57f7;
}

/* CHAT */

.chat-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#f2f2f7;
  color:#111;
}

.real-chat-top{
  min-height:65px;
  padding:calc(env(safe-area-inset-top) + 7px) 12px 7px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:rgba(250,250,252,.97);
  border-bottom:1px solid #dddde2;
  color:#111;
}

.real-chat-back{
  border:0;
  background:none;
  color:#168acd;
  font-size:16px;
  padding:0 5px 6px 0;
}

.real-chat-person{
  flex:1;
  min-width:0;
  text-align:center;
}

.real-chat-name{
  font-weight:700;
}

.real-chat-status{
  font-size:11px;
  color:#929298;
  margin-top:1px;
}

.chat-body{
  flex:1;
  overflow-y:auto;
  padding:14px;
}

.chat-bubble{
  max-width:79%;
  padding:9px 12px;
  border-radius:18px;
  margin:7px 0;
  line-height:1.35;
}

.telegram-chat{
  background:linear-gradient(rgba(228,235,239,.88),rgba(228,235,239,.88));
}

.telegram-chat .chat-bubble.in{
  background:#fff;
  border-radius:17px 17px 17px 5px;
  box-shadow:0 1px 1px rgba(0,0,0,.06);
}

.telegram-chat .chat-bubble.out{
  background:#d9fdd3;
  color:#111;
  border-radius:17px 17px 5px 17px;
}

.max-chat{
  background:#f4f4f7;
}

.max-chat .chat-bubble.in{
  background:#fff;
  color:#111;
}

.max-chat .chat-bubble.out{
  background:#6662f5;
  color:#fff;
}

.chat-photo{
  display:block;
  max-width:230px;
  width:72%;
  border-radius:16px;
  margin:8px 0;
}

.chat-photo.out{
  margin-left:auto;
}

.chat-photo.in{
  margin-right:auto;
}

.compose{
  display:flex;
  gap:8px;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 8px);
  background:#f8f8fa;
  border-top:1px solid #dddde2;
}

.compose input{
  flex:1;
  height:42px;
  border:1px solid #d7d7dc;
  border-radius:21px;
  padding:0 14px;
  background:#fff;
  color:#111;
}

.compose button{
  height:42px;
  min-width:42px;
  border:0;
  border-radius:21px;
  background:#007aff;
  color:#fff;
  padding:0 13px;
}

/* INSTAGRAM */

.social-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  color:#111;
}

.social-top{
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  font-size:21px;
  font-weight:800;
  border-bottom:1px solid #eee;
}

.social-close{
  float:right;
  border:0;
  background:none;
  font-size:20px;
}

.stories{
  display:flex;
  gap:12px;
  padding:12px;
  overflow-x:auto;
  border-bottom:1px solid #eee;

.story{

}

.story-ring{

.story-ring .avatar{

.social-feed{

.post{

}

.post-head{

  align-items:center;
  gap:9px;

}

.post-img{

  object-fit:cover;
  background:#ddd;
}

.post-actions{
  padding:9px 12px;

}

.post-caption{

/* ADMIN */

.admin-section-title{
  margin:20px 2px 8px;
  font-size:13px;
  color:#777;
  text-transform:uppercase;
}

.admin-entry{
  margin-bottom:10px;
  padding:12px;
  border-radius:14px;
  background:#fff;
}

.admin-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.admin-row .avatar{
  width:42px;
  height:42px;
}

.generator-card{
  background:#fff;
  padding:14px;
  border-radius:15px;
  margin-bottom:12px;
}

.generator-title{
  font-weight:700;
  margin-bottom:6px;
}

.generator-note{
  color:#85858a;
  font-size:13px;
  line-height:1.4;
}

.generator-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.generator-buttons button{
  min-height:45px;
  border:0;
  border-radius:12px;
  font-weight:600;

.gen-main{
  background:#007aff;
  color:#fff;
}

.gen-secondary{

/* BROWSER */

.browser-shell{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#000;
}

.browser-frame{
  flex:1;
  width:100%;
  border:0;
  background:#fff;
}
</style>

<body>

<div id="home">

  <div id="adminHotspot"></div>

  <button class="edit-done" onclick="finishEditing()">
    Готово
  </button>

  <div class="pages" id="pagesViewport">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="dock" id="dock"></div>

</div>

<div class="overlay" id="systemOverlay"></div>
<div class="overlay" id="chatOverlay"></div>
<div class="overlay" id="socialOverlay"></div>
<div class="overlay" id="browserOverlay"></div>

<input type="file" id="wallpaperInput" accept="image/*" hidden>
<input type="file" id="iconInput" accept="image/*" hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>
<input type="file" id="chatPhotoInput" accept="image/*" hidden>
<input type="file" id="postPhotoInput" accept="image/*" hidden>

<script>

/* VIEWPORT */

function fixViewport(){
  document.documentElement.style.setProperty(
    "--app-height",
    window.innerHeight + "px"
  );
}

fixViewport();

window.addEventListener("resize",fixViewport);

window.addEventListener(
  "orientationchange",
  ()=>setTimeout(fixViewport,200)
);


/* DATABASE */

const DB_NAME="GuestDesktopV431";
const STORE="assets";

function openDB(){

  return new Promise((resolve,reject)=>{

    const request=
      indexedDB.open(DB_NAME,1);

    request.onupgradeneeded=
      event=>{

        const db=
          event.target.result;

        if(
          !db.objectStoreNames.contains(STORE)
        ){
          db.createObjectStore(
            STORE,
            {keyPath:"id"}
          );
        }

      };

    request.onsuccess=
      ()=>resolve(request.result);

    request.onerror=
      ()=>reject(request.error);

  });

}

async function saveAsset(id,blob){

  const db=
    await openDB();

  return new Promise((resolve,reject)=>{

    const tx=
      db.transaction(
        STORE,
        "readwrite"
      );

    tx.objectStore(STORE).put({
      id,
      blob
    });

    tx.oncomplete=
      ()=>resolve();

    tx.onerror=
      ()=>reject(tx.error);

  });

}

async function getAsset(id){

  if(!id){
    return null;
  }

  const db=
    await openDB();

  return new Promise((resolve,reject)=>{

    const tx=
      db.transaction(
        STORE,
        "readonly"
      );

    const request=
      tx.objectStore(STORE).get(id);

    request.onsuccess=
      ()=>resolve(
        request.result?.blob || null
      );

    request.onerror=
      ()=>reject(request.error);

  });

}

async function deleteAsset(id){

  if(!id){
    return;
  }

  const db=
    await openDB();

  return new Promise(resolve=>{

    const tx=
      db.transaction(
        STORE,
        "readwrite"
      );

    tx.objectStore(STORE).delete(id);

    tx.oncomplete=
      ()=>resolve();

  });

}

const assetUrls=
  new Map();

async function assetUrl(id){

  if(!id){
    return null;
  }

  if(
    assetUrls.has(id)
  ){
    return assetUrls.get(id);
  }

  const blob=
    await getAsset(id);

  if(!blob){
    return null;
  }

  const url=
    URL.createObjectURL(blob);

  assetUrls.set(id,url);

  return url;

}


/* IMAGE COMPRESSION */

function compressFile(
  file,
  maxWidth,
  maxHeight,
  quality=.82
){

  return new Promise((resolve,reject)=>{

    const reader=
      new FileReader();

    reader.onload=()=>{

      const image=
        new Image();

      image.onload=()=>{

        let width=
          image.width;

        let height=
          image.height;

        const ratio=
          Math.min(
            maxWidth/width,
            maxHeight/height,
            1
          );

        width=
          Math.round(width*ratio);

        height=
          Math.round(height*ratio);

        const canvas=
          document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        canvas
        .getContext("2d")
        .drawImage(
          image,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob=>{
            if(blob){
              resolve(blob);
            }else{
              reject();
            }
          },
          "image/jpeg",
          quality
        );

      };

      image.onerror=
        reject;

      image.src=
        reader.result;

    };

    reader.onerror=
      reject;

    reader.readAsDataURL(file);

  });

}


/* SAFE TEXT */

function safe(text){

  return String(text ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function attr(text){

  return safe(text)
  .replaceAll("`","&#096;");

}

/* LOAD STATE */

function cloneDefault(){
  return JSON.parse(
    JSON.stringify(DEFAULT_STATE)
  );
}

function loadState(){

  try{

    const raw=
      localStorage.getItem(
        "iosGuestV42"
      );

    if(!raw){
      return cloneDefault();
    }

    const saved=
      JSON.parse(raw);

    const base=
      cloneDefault();

    return {
      ...base,
      ...saved,

      pages:
        saved.pages || base.pages,

      apps:
        saved.apps || base.apps,

      dock:
        saved.dock || base.dock,

      chats:{
        ...base.chats,
        ...(saved.chats || {})
      },

      stories:
        saved.stories || base.stories,

      posts:
        saved.posts || base.posts
    };

  }

  catch(error){

    return cloneDefault();

  }

}

let state=
  loadState();

function saveState(){

  try{

    localStorage.setItem(
      "iosGuestV42",
      JSON.stringify(state)
    );

  }

  catch(error){

    alert(
      "Не удалось сохранить настройки."
    );

  }

}

async function hydrateImages(){

  const nodes=
    document.querySelectorAll(
      "[data-image-id]"
    );

  for(
    const node of nodes
  ){

    const id=
      node.dataset.imageId;

    if(
      !id ||
      node.querySelector("img")
    ){
      continue;
    }

    const url=
      await assetUrl(id);

    if(url){

      const img=
        document.createElement("img");

      img.src=url;

      node.appendChild(img);

    }

  }

}


/* CREATE APP */

function createApp(app){

  const element=
    document.createElement("div");

  element.className="app";

  element.innerHTML=`

    ${
      app.removable !== false
      ?
      `<button class="delete-app">−</button>`
      :
      ""
    }

    ${iconHTML(app)}

    <div class="app-name">
      ${safe(app.title)}
    </div>
  `;

  const del=
    element.querySelector(
      ".delete-app"
    );

  if(del){

    del.onclick=
    async event=>{

      event.stopPropagation();

      if(app.imageId){
        await deleteAsset(app.imageId);
      }

      state.apps=
      state.apps.filter(
        item=>item.id!==app.id
      );

      saveState();
      render();

    };

  }

  element.onclick=()=>{

    if(state.editing){
      return;
    }

    openApp(app);

  };

  return element;

}


/* RENDER */

function render(){

  const track=
    document.getElementById(
      "track"
    );

  const dots=
    document.getElementById(
      "dots"
    );

  const dock=
    document.getElementById(
      "dock"
    );

  track.innerHTML="";
  dots.innerHTML="";
  dock.innerHTML="";

  state.currentPage=
    Math.max(
      0,
      Math.min(
        state.currentPage,
        state.pages.length-1
      )
    );

  state.pages.forEach(
    (page,index)=>{

      const pageElement=
        document.createElement(
          "section"
        );

      pageElement.className=
        "page";

      const grid=
        document.createElement(
          "div"
        );

      grid.className=
        "grid";

      state.apps
      .filter(
        app=>
        app.pageId===page.id
      )
      .forEach(
        app=>{
          grid.appendChild(
            createApp(app)
          );
        }
      );

      pageElement.appendChild(
        grid
      );

      track.appendChild(
        pageElement
      );

      const dot=
        document.createElement(
          "div"
        );

      dot.className=
        "dot"
        +
        (
          index===state.currentPage
          ?
          " active"
          :
          ""
        );

      dots.appendChild(dot);

    }
  );

  state.dock.forEach(
    app=>{
      dock.appendChild(
        createApp(app)
      );
    }
  );

  document
  .getElementById("home")
  .classList.toggle(
    "editing",
    state.editing
  );

  updatePage(false);

  hydrateImages();

}


/* PAGE */

function updatePage(
  animate=true
){

  const track=
    document.getElementById(
      "track"
    );

  track.style.transition=
    animate
    ?
    "transform .32s cubic-bezier(.22,.7,.18,1)"
    :
    "none";

  track.style.transform=
    `translateX(-${state.currentPage*100}%)`;

  document
  .querySelectorAll(".dot")
  .forEach(
    (dot,index)=>{

      dot.classList.toggle(
        "active",
        index===state.currentPage
      );

    }
  );

}


/* SWIPE */

const viewport=
  document.getElementById(
    "pagesViewport"
  );

let startX=0;
let startY=0;

viewport.addEventListener(
  "touchstart",
  event=>{

    startX=
      event.touches[0].clientX;

    startY=
      event.touches[0].clientY;

  },
  {passive:true}
);

viewport.addEventListener(
  "touchend",
  event=>{

    const touch=
      event.changedTouches[0];

    const dx=
      touch.clientX-startX;

    const dy=
      touch.clientY-startY;

    if(
      Math.abs(dx)<45 ||
      Math.abs(dx)<Math.abs(dy)
    ){
      return;
    }

    if(
      dx<0 &&
      state.currentPage<
      state.pages.length-1
    ){

      state.currentPage++;

    }

    else if(
      dx>0 &&
      state.currentPage>0
    ){

      state.currentPage--;

    }

    saveState();
    updatePage(true);

  },
  {passive:true}
);

    setTimeout(
      ()=>{

        navigator.vibrate?.(30);

        openSettings();

      1500
    );

}

  clearTimeout(adminTimer);
}

);

adminHotspot.addEventListener(
  "pointerup",
  stopAdmin
);

adminHotspot.addEventListener(
  "pointercancel",
  stopAdmin
);

  "pointerleave",

);

async function openWallpaperSettings(){

  for(
    const wallpaper of state.wallpapers
  ){

    const url=
      await assetUrl(
        wallpaper.id
      );

    if(!url){
      continue;
    }

    html+=`

      <div
      class="
        wallpaper
        ${
          state.currentWallpaperId===
          wallpaper.id
          ?
          "selected"
          :
          ""
        }
      "

      style="
        background-image:
        url('${url}')
      "

      onclick="
        selectWallpaper(
          '${wallpaper.id}'
        )
      ">

        <button
        class="wallpaper-delete"
        onclick="
          event.stopPropagation();
          removeWallpaper(
            '${wallpaper.id}'
          )
        ">
          ×
        </button>

      </div>
    `;

  }

  html+=
    `</div>`;

  html+=`

    <button
    class="primary"
    onclick="
      document
      .getElementById(
        'wallpaperInput'
      )
      .click()
    ">
      Добавить фото
    </button>
  `;

  showSystem(
    "Обои",
    html,
    "openSettings()"
  );

}

document
.getElementById(
  "wallpaperInput"
)
.addEventListener(
  "change",
  async function(){

    const file=
      this.files[0];

    if(!file){
      return;
    }

    const blob=
      await compressFile(
        file,
        1179,
        2556,
        .80
      );

    const id=
      "wall_"
      +
      Date.now();

    await saveAsset(
      id,
      blob
    );

    state.wallpapers.push({
      id
    });

    state.currentWallpaperId=
      id;

    saveState();

    await applyWallpaper();

    await openWallpaperSettings();

    this.value="";

  }
);

async function selectWallpaper(id){

  state.currentWallpaperId=id;

  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}

async function removeWallpaper(id){

  await deleteAsset(id);

  state.wallpapers=
    state.wallpapers.filter(
      item=>item.id!==id
    );

  if(
    state.currentWallpaperId===id
  ){

    state.currentWallpaperId=
      state.wallpapers[0]?.id
      ||
      null;

  }

  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}

function randomItem(array){

  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];

}

function randomInt(min,max){

  return Math.floor(
    Math.random()*(max-min+1)
  )+min;

}

function randomTime(){

  const now=
    new Date();

  const minutesAgo=
    randomInt(3,4000);

  const date=
    new Date(
      now.getTime()
      -
      minutesAgo*60000
    );

  if(
    date.toDateString()===
    now.toDateString()
  ){

    return date.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

  const yesterday=
    new Date(
      now.getTime()
      -
      86400000
    );

  if(
    date.toDateString()===
    yesterday.toDateString()
  ){

    return "вчера";

  }

  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}

function buildConversation(){

  const messages=[];

  const count=
    randomInt(5,18);

  messages.push({
    side:"in",
    text:randomItem(
      conversationStarts
    ),
    photoId:null
  });

  for(
    let i=1;
    i<count;
    i++
  ){

    messages.push({

      side:
        Math.random()>.48
        ?
        "out"
        :
        "in",

      text:
        randomItem(
          normalMessages
        ),

      photoId:null

    });

  }

  return messages;

}

function generateChatSystem(
  kind,
  amount=20
){

  const used=
    new Set();

  const chats=[];

  for(
    let i=0;
    i<amount;
    i++
  ){

    let name;

    if(
      Math.random()<.16
    ){

      name=
        randomItem(chatGroups);

    }else{

      do{

        name=
          randomItem(chatPeople);

      }

      while(
        used.has(name)
        &&
        used.size<
        chatPeople.length
      );

    }

    used.add(name);

    const messages=
      buildConversation();

    const last=
      messages[
        messages.length-1
      ];

    chats.push({

      id:
        kind
        +
        "_auto_"
        +
        Date.now()
        +
        "_"
        +
        i,

      name,

      avatarId:null,

      messages,

      last:
        last.text
        ||
        "Фото",

      time:
        randomTime(),

      unread:
        Math.random()<.35
        ?
        randomInt(1,8)
        :
        0,

      pinned:
        Math.random()<.12

    });

  }

  state.chats[kind]=chats;

  saveState();

  openChatAdmin(
    kind,
    kind==="telegram"
    ?
    "Telegram"
    :
    "MAX"
  );

}

function addRandomActivity(kind){

  const chats=
    state.chats[kind]
    ||
    [];

  if(!chats.length){

    generateChatSystem(
      kind,
      15
    );

    return;

  }

  const amount=
    randomInt(
      3,
      Math.min(
        8,
        chats.length
      )
    );

  const shuffled=
    [...chats]
    .sort(
      ()=>Math.random()-.5
    );

  shuffled
  .slice(
    0,
    amount
  )
  .forEach(
    chat=>{

      const incoming=
        Math.random()>.25;

      const text=
        randomItem(
          normalMessages
        );

      chat.messages.push({

        side:
          incoming
          ?
          "in"
          :
          "out",

        text,

        photoId:null

      });

      chat.last=text;

      chat.time=
        new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

      if(incoming){

        chat.unread=
          (chat.unread||0)
          +
          1;

      }

    }
  );

  state.chats[kind]=
    shuffled;

  saveState();

  openChatAdmin(
    kind,
    kind==="telegram"
    ?
    "Telegram"
    :
    "MAX"
  );

}

async function hydrateAvatars(){

  const nodes=
    document.querySelectorAll(
      "[data-avatar-id]"

  for(
    const node of nodes

      node.dataset.avatarId;

    if(!id){
      continue;
    }

    const url=
      await assetUrl(id);

    if(url){
      node.innerHTML=
        `<img src="${url}">`;
    }

  }

}

  if(!chat){

    chat={

      id:
        kind
        +
        "_"
        +
        Date.now(),

      name:"",

      last:"",

      time:randomTime(),

      unread:0,

async function addAdminMessage(kind,id){

  const chat=
    state.chats[kind]
    .find(
      item=>item.id===id
    );

  if(!chat){
    return;
  }

  const message={

    side:
      document
      .getElementById(
        "messageSide"
      )
      .value,

    text:
      document
      .getElementById(
        "messageText"
      )
      .value
      .trim(),

    photoId:null

  };

  if(
    pendingChatPhotoBlob
  ){

    const photoId=
      "chatphoto_"
      +
      Date.now();

    await saveAsset(
      photoId,
      pendingChatPhotoBlob
    );

    message.photoId=
      photoId;

    pendingChatPhotoBlob=
      null;

  if(
    !message.text &&
    !message.photoId

  chat.messages.push(
    message

  chat.last=
    message.photoId
    ?
    "Фото"
    :
    message.text;

  chat.time=
    new Date()
    .toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  saveState();

  editMessagesAdmin(
    kind,
    id
  );

}

function deleteMessage(
  kind,
  id,
  index
){

  const chat=
    state.chats[kind]
    .find(
      item=>item.id===id
    );

  if(!chat){
    return;
  }

  chat.messages.splice(
    index,
    1
  );

  saveState();

  editMessagesAdmin(
    kind,
    id
  );

}

async function openStyledChat(
  kind,
  id
){

  const chat=
    state.chats[kind]
    .find(
      item=>item.id===id
    );

  if(!chat){
    return;
  }

  chat.unread=0;

  saveState();

  let messages="";

  for(
    const message of chat.messages
  ){

    if(message.photoId){

      const url=
        await assetUrl(
          message.photoId
        );

      if(url){

        messages+=`

          <img
          class="
            chat-photo
            ${message.side}
          "
          src="${url}">
        `;

      }

    }

    if(message.text){

      messages+=`

        <div
        class="
          chat-bubble
          ${message.side}
        ">
          ${safe(message.text)}
        </div>
      `;

    }

  }

  const overlay=
    document.getElementById(
      "chatOverlay"
    );

  const back=
    kind==="telegram"
    ?
    "openTelegram()"
    :
    "openMax()";

  overlay.innerHTML=`

    class="
      chat-shell
      ${kind}-chat
    ">

      <div class="real-chat-top">

        <button
        class="real-chat-back"

          <div class="real-chat-name">
            ${safe(chat.name)}
          </div>

          <div class="real-chat-status">
            ${
              kind==="telegram"
              ?
              "был(а) недавно"
              :
              "в сети"
            }
          </div>

        </div>

        <div style="width:42px">
        </div>

      </div>

      <div
      class="chat-body"
      id="styledChatBody">
        ${messages}
      </div>

      <div class="compose">

        <input
        id="styledMessage"
        placeholder="Сообщение">

        <button
        onclick="
          sendStyledMessage(
            '${kind}',
            '${id}'
          )
        ">
          ↑
        </button>

      </div>

    </div>
  `;

  overlay.classList.add(
    "show"
  );

  setTimeout(
    ()=>{

            ${safe(post.user)}
          </b>

          <div class="settings-small">
            ${safe(post.caption)}
          </div>

          <button
          class="secondary"
          onclick="
            editPost(
              '${post.id}'
            )
          ">
            Изменить
          </button>

        </div>
      `;

    }
  );

  html+=`

    <button
    class="primary"
    onclick="editPost('')">
      Добавить публикацию
    </button>
  `;

  showSystem(
    "Лента",
    html,
    "openContentSettings()"
  );

}

function editPost(id){

  const post=
    state.posts.find(
      item=>item.id===id
    )
    ||
    {
      id:"",
      user:"",
      caption:"",
      avatarId:null,
      imageId:null
    };

  showSystem(

    id
    ?
    "Публикация"
    :
    "Новая публикация",

    `
    <input
    class="field"
    id="postUser"
    placeholder="Имя профиля"
    value="${attr(post.user)}">

    <textarea
    class="field"
    id="postCaption"
    placeholder="Подпись">${safe(post.caption)}</textarea>

    <button
    class="secondary"
    onclick="choosePostPhoto()">
      Выбрать фото публикации
    </button>

    <button
    class="primary"
    onclick="
      savePost(
        '${id}'
      )
    ">
      Сохранить
    </button>
    `,

    "openInstagramAdmin()"

  );

}

let pendingPostBlob=null;

function choosePostPhoto(){

  document
  .getElementById(
    "postPhotoInput"
  )
  .click();

}

document
.getElementById(
  "postPhotoInput"
)
.addEventListener(
  "change",
  async function(){

    const file=
      this.files[0];

    if(file){

      pendingPostBlob=
        await compressFile(
          file,
          1400,
          1400,
          .84
        );

    }

    this.value="";

  }
);

async function savePost(id){

  let post=
    state.posts.find(
      item=>item.id===id
    );

  if(!post){

    post={

      id:
        "post_"
        +
        Date.now(),

      user:"",

      caption:"",

      avatarId:null,

      imageId:null

    };

    state.posts.unshift(post);

  }

  post.user=
    document
    .getElementById(
      "postUser"
    )
    .value
    .trim()
    ||
    "profile";

  post.caption=
    document
    .getElementById(
      "postCaption"
    )
    .value
    .trim();

  if(
    pendingPostBlob
  ){

    const imageId=
      "postimage_"
      +
      Date.now();

    await saveAsset(
      imageId,
      pendingPostBlob
    );

    post.imageId=
      imageId;

    pendingPostBlob=
      null;

  }

  saveState();

  openInstagramAdmin();

}


/* INSTAGRAM */

      "socialOverlay"

  let storiesHtml="";

      safe(
        story.name[0] || "?"

        await assetUrl(
          story.avatarId
        );

      if(url){
        avatar=
          `<img src="${url}">`;
      }

    }

    storiesHtml+=`

      <div class="story">

        <div class="story-ring">

          <div class="avatar">
            ${avatar}
          </div>

        </div>

        <div>
          ${safe(story.name)}
        </div>

      </div>
    `;

  }

  let postsHtml="";

  for(
    const post of state.posts
  ){

    let imageHtml=`

      <div
      class="post-img"
      style="
        background:
        linear-gradient(
          145deg,
          #efb267,
          #7556da
        );
      ">
      </div>
    `;

    if(post.imageId){

      const url=
        await assetUrl(
          post.imageId
        );

        `;

      }

    }

    postsHtml+=`

      <div class="post">

        <div class="post-head">

          <div class="avatar">
            ${safe(post.user[0] || "?")}
          </div>

          <b>
            ${safe(post.user)}
          </b>

        </div>

        ${imageHtml}

        <div class="post-actions">
          ♡　💬　⌁
        </div>

        <div class="post-caption">

          <b>
            ${safe(post.user)}
          </b>

          ${safe(post.caption)}

        </div>

      </div>
    `;

  }

  overlay.innerHTML=`

    <div class="social-shell">

      <div class="social-top">

        Instagram

        <button
        class="social-close"
        onclick="closeSocial()">
          ✕
        </button>

      </div>

      <div class="stories">
        ${storiesHtml}
      </div>

      <div class="social-feed">
        ${postsHtml}
      </div>

    </div>
  `;

  overlay.classList.add(
    "show"
  );

function closeSocial(){

  const overlay=
    document.getElementById(
      "socialOverlay"
    );

  overlay.classList.remove(
    "show"
  );

  overlay.innerHTML="";

}


/* PAGE SETTINGS */

function openPageSettings(){

  let html=
    `<div class="settings-group">`;

  state.pages.forEach(
    page=>{

      const count=
        state.apps.filter(
          app=>app.pageId===page.id
        ).length;

      html+=`

        <div class="settings-row">

          <div class="settings-main">

            ${safe(page.name)}

            <div class="settings-small">
              ${count} прилож.
            </div>

          </div>

          ${
            state.pages.length>1
            ?
            `
            <button
            style="
              border:0;
              background:none;
              color:#ff3b30;
            "
            onclick="
              removePage(
                '${page.id}'
              )
            ">
              Удалить
            </button>
            `
            :
            ""
          }

        </div>
      `;

    }
  );

  html+=
    `</div>`;

  html+=`

    <button
    class="primary"
    onclick="addPage()">
      Добавить страницу
    </button>
  `;

  showSystem(
    "Рабочие столы",
    html,
    "openSettings()"
  );

}

function addPage(){

  state.pages.push({

    id:
      "page_"
      +
      Date.now(),

    name:
      "Страница "
      +
      (
        state.pages.length+1
      )

  });

  state.currentPage=
    state.pages.length-1;

  saveState();

  render();

  openPageSettings();

}

function removePage(id){

  if(
    state.pages.length<=1
  ){
    return;
  }

  const target=
    state.pages.find(
      page=>page.id!==id
    );

  state.apps.forEach(
    app=>{

      if(
        app.pageId===id
      ){
        app.pageId=
          target.id;
      }

    }
  );

  state.pages=
    state.pages.filter(
      page=>page.id!==id
    );

  state.currentPage=0;

  saveState();

  render();

  openPageSettings();

}


/* APP SETTINGS + ICON CHANGE */

let iconTargetAppId=null;
let pendingIconBlob=null;

function openAppSettings(){

  let html=
    `<div class="settings-group">`;

  state.apps.forEach(
    app=>{

      const page=
        state.pages.find(
          item=>item.id===app.pageId
        );

      html+=`

        <div class="settings-row">

          <div class="settings-main">

            ${safe(app.title)}

            <div class="settings-small">
              ${safe(page?.name || "")}
            </div>

          </div>

          <button
          style="
            border:0;
            background:none;
            color:#007aff;
          "
          onclick="
            chooseAppIcon(
              '${app.id}'
            )
          ">
            Иконка
          </button>

        </div>
      `;

    }
  );

  html+=
    `</div>`;

  html+=`

    <button
    class="primary"
    onclick="openAddApp()">
      Добавить приложение
    </button>
  `;

  showSystem(
    "Приложения",
    html,
    "openSettings()"
  );

}

function chooseAppIcon(appId){

  iconTargetAppId=
    appId;

  document
  .getElementById(
    "iconInput"
  )
  .click();

}

function openAddApp(){

  const pageOptions=
    state.pages
    .map(
      page=>`

        <option value="${page.id}">
          ${safe(page.name)}
        </option>
      `
    )
    .join("");

  showSystem(

    "Добавить",

    `
    <input
    class="field"
    id="newAppTitle"
    placeholder="Название">

    <input
    class="field"
    id="newAppUrl"
    placeholder="https://... или URL-схема">

    <select
    class="field"
    id="newAppPage">
      ${pageOptions}
    </select>

    <button
    class="secondary"
    onclick="
      document
      .getElementById(
        'iconInput'
      )
      .click()
    ">
      Выбрать свою иконку
    </button>

    <button
    class="primary"
    onclick="saveNewApp()">
      Добавить
    </button>
    `,

    "openAppSettings()"

  );

}

document
.getElementById(
  "iconInput"
)
.addEventListener(
  "change",
  async function(){

    const file=
      this.files[0];

    if(!file){
      return;
    }

    try{

      const blob=
        await compressFile(
          file,
          512,
          512,
          .90
        );

      if(iconTargetAppId){

        const app=
          state.apps.find(
            item=>
            item.id===iconTargetAppId
          );

        if(app){

          if(app.imageId){
            await deleteAsset(
              app.imageId
            );
          }

          const imageId=
            "appicon_"
            +
            Date.now();

          await saveAsset(
            imageId,
            blob
          );

          app.imageId=imageId;

          saveState();

          render();

          openAppSettings();

        }

        iconTargetAppId=null;

        this.value="";

        return;

      }

      pendingIconBlob=blob;

    }

    catch(error){

      alert(
        "Не удалось обработать иконку."
      );

    }

    this.value="";

  }
);

async function saveNewApp(){

  const title=
    document
    .getElementById(
      "newAppTitle"
    )
    .value
    .trim();

  if(!title){

    alert(
      "Введите название."
    );

    return;

  }

  let imageId=null;

  if(
    pendingIconBlob
  ){

    imageId=
      "icon_"
      +
      Date.now();

    await saveAsset(
      imageId,
      pendingIconBlob
    );

    pendingIconBlob=null;

  }

  state.apps.push({

    id:
      "app_"
      +
      Date.now(),

    title,

    icon:"⭐",

    imageId,

    pageId:
      document
      .getElementById(
        "newAppPage"
      )
      .value,

    type:"url",

    url:
      document
      .getElementById(
        "newAppUrl"
      )
      .value
      .trim(),

    removable:true

  });

  saveState();

  render();

  openAppSettings();

}

function openNotes(){

  const notes=
    JSON.parse(
      localStorage.getItem(
        "v431Notes"
      )
      ||
      "[]"
    );

  const list=
    notes
    .map(
      (note,index)=>`

        <div

        onclick="
          editNote(
            ${index}
          )
        ">

          <b>
            ${safe(note.title)}
          </b>

          <div class="settings-small">
            ${safe((note.text||"").slice(0,80))}
          </div>

        </div>
      `
    )
    .join("");

  showSystem(

    "Заметки",

    `
    <button
    class="primary"
    onclick="editNote(-1)">
      Новая заметка
    </button>

    <div style="margin-top:15px">
      ${list}
    </div>
    `

  );

}

function editNote(index){

  const notes=
    JSON.parse(
      localStorage.getItem(
        "v431Notes"
      )
      ||
      "[]"
    );

  const note=
    index>=0
    ?
    notes[index]
    :
    {
      title:"",
      text:""
    };

  showSystem(

    "Заметка",

    `
    <input
    class="field"
    id="noteTitle"
    placeholder="Название"
    value="${attr(note.title)}">

    <textarea
    class="field"
    id="noteText"
    placeholder="Текст">${safe(note.text)}</textarea>

    <button
    class="primary"
    onclick="
      saveNote(
        ${index}
      )
    ">
      Сохранить
    </button>
    `,

    "openNotes()"

  );

}

function saveNote(index){

  const notes=
    JSON.parse(
      localStorage.getItem(
        "v431Notes"
      )
      ||
      "[]"
    );

  const note={

    title:
      document
      .getElementById(
        "noteTitle"
      )
      .value,

    text:
      document
      .getElementById(
        "noteText"
      )
      .value

  };

  if(index>=0){

    notes[index]=note;

  }else{

    notes.unshift(note);

  }

  localStorage.setItem(
    "v431Notes",
    JSON.stringify(notes)
  );

  openNotes();

}
