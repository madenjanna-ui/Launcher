<!DOCTYPE html>
<html lang="ru">
<head>

<title>Home</title>

<style>

:root{
  --glass:rgba(255,255,255,.17);
  --glassStrong:rgba(255,255,255,.25);
  --line:rgba(255,255,255,.25);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  "Segoe UI",
  sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  appearance:none;
  -webkit-appearance:none;
}


/* =====================================================
   HOME
===================================================== */

#home{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  min-height:100svh;
  min-height:100dvh;

  overflow:hidden;

  background:
  linear-gradient(
    160deg,
    #4b5f7b,
    #26354a 50%,
    #0c121c
  );

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#home::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
  linear-gradient(
    180deg,
    rgba(0,0,0,.01),
    rgba(0,0,0,.02) 60%,
    rgba(0,0,0,.22)
  );
}


/* =====================================================
   INVISIBLE ADMIN HOTSPOT
===================================================== */

.admin-hotspot{
  position:absolute;

  top:0;
  left:0;

  z-index:50;

  width:55px;
  height:55px;

  opacity:0;
}


/* =====================================================
   PAGES
===================================================== */

.pages{
  position:absolute;

  left:0;
  right:0;

  top:
  calc(
    env(safe-area-inset-top)
    +
    18px
  );

  bottom:
  calc(
    env(safe-area-inset-bottom)
    +
    120px
  );

  overflow:hidden;
}

.track{
  height:100%;

  display:flex;

  transition:
  transform .32s
  cubic-bezier(.22,.7,.18,1);
}

.page{
  flex:0 0 100%;

  width:100%;
  height:100%;

  padding:
  20px
  18px
  20px;

  overflow-y:auto;

  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   IOS-LIKE APP GRID
===================================================== */

.grid{
  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  column-gap:12px;

  row-gap:22px;

  align-content:start;
}

.app{
  position:relative;

  min-width:0;

  text-align:center;

  user-select:none;

  cursor:pointer;
}

.app-icon{
  position:relative;

  width:min(16.8vw,68px);
  height:min(16.8vw,68px);

  margin:auto;

  border-radius:17px;

  overflow:hidden;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:31px;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.32),
    rgba(255,255,255,.08)
  );

  border:
  1px solid
  rgba(255,255,255,.25);

  box-shadow:
  0 8px 20px
  rgba(0,0,0,.22),

  inset 0 1px 1px
  rgba(255,255,255,.55);

  backdrop-filter:
  blur(16px)
  saturate(175%);

  -webkit-backdrop-filter:
  blur(16px)
  saturate(175%);
}

.app-icon::before{
  content:"";

  position:absolute;

  left:-10%;
  top:-35%;

  width:85%;
  height:65%;

  border-radius:50%;

  background:
  rgba(255,255,255,.22);

  filter:blur(9px);
}

.app-icon img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
}

.emoji{
  position:relative;
  z-index:2;
}

.app-name{
  margin-top:6px;

  font-size:11.5px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-shadow:
  0 1px 4px
  rgba(0,0,0,.85);
}


/* =====================================================
   EDIT MODE
===================================================== */

.editing .app{
  animation:
  wiggle .18s
  infinite
  alternate;
}

@keyframes wiggle{

  from{
    transform:rotate(-1.1deg);
  }

  to{
    transform:rotate(1.1deg);
  }

}

.delete-app{
  display:none;

  position:absolute;

  left:2px;
  top:-5px;

  z-index:10;

  width:23px;
  height:23px;

  border-radius:50%;

  border:0;

  background:
  rgba(35,35,38,.9);

  color:#fff;

  font-size:18px;

  line-height:20px;
}

.editing .delete-app{
  display:block;
}


/* =====================================================
   DOTS
===================================================== */

.dots{
  position:absolute;

  left:0;
  right:0;

  bottom:
  calc(
    env(safe-area-inset-bottom)
    +
    99px
  );

  z-index:7;

  display:flex;

  justify-content:center;

  gap:7px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:
  rgba(255,255,255,.35);
}

.dot.active{
  background:#fff;
}


/* =====================================================
   DOCK
===================================================== */

.dock{
  position:absolute;

  left:14px;
  right:14px;

  bottom:
  max(
    9px,
    env(safe-area-inset-bottom)
  );

  z-index:8;

  height:88px;

  border-radius:28px;

  display:flex;

  align-items:center;

  justify-content:
  space-around;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.24),
    rgba(255,255,255,.08)
  );

  border:
  1px solid
  rgba(255,255,255,.24);

  box-shadow:
  0 11px 30px
  rgba(0,0,0,.28);

  backdrop-filter:
  blur(26px)
  saturate(180%);

  -webkit-backdrop-filter:
  blur(26px)
  saturate(180%);
}

.dock .app-icon{
  width:61px;
  height:61px;

  border-radius:16px;
}

.dock .app-name{
  display:none;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  display:none;

  position:absolute;

  inset:0;

  z-index:100;

  overflow:auto;
}

.overlay.show{
  display:block;
}


/* =====================================================
   SEARCH
===================================================== */

#searchOverlay{

  rgba(20,20,25,.75);

}

.searchbox{

}

.searchbox input{

}

.search-cancel{

  background:none;

.search-results{

.search-item{

.search-item .app-icon{

  height:48px;

/* =====================================================

===================================================== */

.system-top{

.settings-group{

.settings-row{

.settings-row:last-child{

.settings-icon{
  width:31px;

.browser-top{

<script>

    },

    }

  ]

};


function cloneDefault(){

  return JSON.parse(
    JSON.stringify(
      defaultState
    )
  );

}


function loadState(){

  try{

    const saved =
    JSON.parse(
      localStorage.getItem(
        "iosGuestV4"
      )
    );


    if(!saved){

      return cloneDefault();

    }


    return Object.assign(
      cloneDefault(),
      saved
    );

  }

  catch(error){

    return cloneDefault();

  }

}


let state =
loadState();


function save(){

  try{

    localStorage.setItem(

      "iosGuestV4",

      JSON.stringify(state)

    );

  }

  catch(error){

    alert(
      "Недостаточно памяти."
    );

  }

}


/* =====================================================
   WALLPAPER
===================================================== */

function applyWallpaper(){

  const home =
  document.getElementById(
    "home"
  );


  if(
    state.currentWallpaper
  ){

    home.style
    .backgroundImage =
    `url("${state.currentWallpaper}")`;

  }

  else{

    home.style
    .backgroundImage =

    "linear-gradient(160deg,#4b5f7b,#26354a 50%,#0c121c)";

  }

}


function compressImage(
  source,
  maxWidth,
  maxHeight,
  quality,
  callback
){

  const image =
  new Image();


  image.onload = ()=>{

    let width =
    image.width;

    let height =
    image.height;


    const ratio =
    Math.min(

      maxWidth / width,

      maxHeight / height,

      1

    );


    width =
    Math.round(
      width * ratio
    );


    height =
    Math.round(
      height * ratio
    );


    const canvas =
    document.createElement(
      "canvas"
    );


    canvas.width =
    width;

    canvas.height =
    height;


    canvas
    .getContext("2d")
    .drawImage(

      image,

      0,
      0,

      width,
      height

    );


    callback(

      canvas.toDataURL(

        "image/jpeg",

        quality

      )

    );

  };


  image.src =
  source;

}


/* =====================================================
   APP ICON
===================================================== */

function iconHTML(app){

  if(
    app.image
  ){

    return `

    <div class="app-icon">

      <img
      src="${app.image}"
      alt="">

    </div>

    `;

  }


  return `

  <div class="app-icon">

    <span class="emoji">

      ${
        safe(
          app.icon
          ||
          "⭐"
        )
      }

    </span>

  </div>

  `;

}


/* =====================================================
   APP ELEMENT
===================================================== */

function createApp(app){

  const element =
  document.createElement(
    "div"
  );


  element.className =
  "app";


  element.innerHTML = `

    ${
      app.removable
      !==
      false

      ?

      `

      <button
      class="delete-app">

        −

      </button>

      `

      :

      ""
    }


    ${iconHTML(app)}


    <div class="app-name">

      ${
        safe(
          app.title
        )
      }

    </div>

  `;


  const del =
  element.querySelector(
    ".delete-app"
  );


  if(
    del
  ){

    del.onclick = event =>{

      event.stopPropagation();


      state.apps =
      state.apps.filter(

        item =>
        item.id
        !==
        app.id

      );


      save();

      render();

    };

  }


  element.onclick = ()=>{

    if(
      state.editing
    ){

      return;

    }


    openApp(app);

  };


  return element;

}


/* =====================================================
   RENDER HOME
===================================================== */

function render(){

  const track =
  document.getElementById(
    "track"
  );


  const dots =
  document.getElementById(
    "dots"
  );


  const dock =
  document.getElementById(
    "dock"
  );


  track.innerHTML =
  "";

  dots.innerHTML =
  "";

  dock.innerHTML =
  "";


  state.pages
  .forEach(

    (
      page,
      index
    ) =>{


      const pageElement =
      document.createElement(
        "section"
      );


      pageElement.className =
      "page";


      const grid =
      document.createElement(
        "div"
      );


      grid.className =
      "grid";


      state.apps

      .filter(

        app =>
        app.pageId
        ===
        page.id

      )

      .forEach(

        app =>{

          grid.appendChild(
            createApp(app)
          );

        }

      );


      pageElement
      .appendChild(
        grid
      );


      track
      .appendChild(
        pageElement
      );


      const dot =
      document.createElement(
        "div"
      );


      dot.className =
      "dot"
      +
      (
        index
        ===
        state.currentPage

        ?

        " active"

        :

        ""
      );


      dots
      .appendChild(
        dot
      );

    }

  );


  state.dock
  .forEach(

    app =>{

      dock.appendChild(
        createApp(app)
      );

    }

  );


  document
  .getElementById(
    "home"
  )
  .classList
  .toggle(

    "editing",

    state.editing

  );


  updatePage(false);

}


/* =====================================================
   PAGE
===================================================== */

function updatePage(
  animate=true
){

  state.currentPage =
  Math.max(

    0,

    Math.min(

      state.currentPage,

      state.pages.length
      -
      1

    )

  );


  const track =
  document.getElementById(
    "track"
  );


  track.style
  .transition =

  animate

  ?

  "transform .32s cubic-bezier(.22,.7,.18,1)"

  :

  "none";


  track.style
  .transform =

  `translateX(-${state.currentPage * 100}%)`;


  document
  .querySelectorAll(
    ".dot"
  )
  .forEach(

    (
      dot,
      index
    ) =>{

      dot.classList
      .toggle(

        "active",

        index
        ===
        state.currentPage

      );

    }

  );

}


/* =====================================================
   SWIPE PAGE + SEARCH
===================================================== */

const viewport =
document.getElementById(
  "pagesViewport"
);


let sx =
0;

let sy =
0;


viewport
.addEventListener(

  "touchstart",

  event =>{

    sx =
    event.touches[0]
    .clientX;

    sy =
    event.touches[0]
    .clientY;

  },

  {
    passive:true
  }

);


viewport
.addEventListener(

  "touchend",

  event =>{


    const touch =
    event.changedTouches[0];


    const dx =
    touch.clientX
    -
    sx;


    const dy =
    touch.clientY
    -
    sy;


    /* swipe down = search */

    if(

      dy
      >
      90

      &&

      Math.abs(dy)
      >
      Math.abs(dx)

    ){

      openSearch();

      return;

    }


    if(

      Math.abs(dx)
      <
      45

      ||

      Math.abs(dx)
      <
      Math.abs(dy)

    ){

      return;

    }


    if(

      dx
      <
      0

      &&

      state.currentPage
      <
      state.pages.length
      -
      1

    ){

      state.currentPage++;

    }


    else if(

      dx
      >
      0

      &&

      state.currentPage
      >
      0

    ){

      state.currentPage--;

    }


    save();

    updatePage(true);

  },

  {
    passive:true
  }

);


/* =====================================================
   LONG PRESS EMPTY SPACE
===================================================== */

let editTimer;


viewport
.addEventListener(

  "pointerdown",

  event =>{


    if(
      event.target.closest(
        ".app"
      )
    ){

      return;

    }


    editTimer =
    setTimeout(

      ()=>{

        state.editing =
        true;

        save();

        render();

      },

      900

    );

  }

);


[
  "pointerup",
  "pointermove",
  "pointercancel"
]
.forEach(

  name =>{

    viewport.addEventListener(

      name,

      ()=>{

        clearTimeout(
          editTimer
        );

      }

    );

  }

);

function openApp(app){

  switch(
    app.type
  ){

    case "settings":

      openSettings();

      break;


    case "catalog":

      openCatalog();

      break;


    case "messages":

      openMessages();

      break;


    case "contacts":

      openContacts();

      break;


    case "photos":

      openPhotos();

      break;


    case "notes":

      openNotes();

      break;


    case "calculator":

      openCalculator();

      break;


    case "social":

      openSocial();

      break;


    case "url":

      if(
        /^https?:\/\//i
        .test(app.url)
      ){

        openBrowser(

          app.url,

          app.title

        );

      }

      else{

        window.location.href =
        app.url;

      }

      break;

  }

}

function openWallpaperSettings(){

        ">

      </div>

    }

  );


  showSystem(

    "Обои",

document
.getElementById(
  "wallpaperInput"
)
.addEventListener(

  "change",

  function(){


    const file =
    this.files[0];


    if(
      !file
    ){

      return;

    }


    const reader =
    new FileReader();


    reader.onload =
    event =>{


      compressImage(

        event.target.result,

        1179,

        2556,

        .8,

        image =>{


          const id =
          "wall_"
          +
          Date.now();


          state.wallpapers
          .push({

            id:id,

            image:image

          });


          state.currentWallpaper =
          image;


          save();

          applyWallpaper();

          openWallpaperSettings();

        }

      );

    };


    reader.readAsDataURL(
      file
    );


    this.value =
    "";

  }

);


function selectWallpaper(id){

  const item =
  state.wallpapers
  .find(

    wall =>
    wall.id
    ===
    id

  );


  if(
    !item
  ){

    return;

  }


  state.currentWallpaper =
  item.image;


  save();

  applyWallpaper();

  openWallpaperSettings();

}


function deleteWallpaper(id){

  const item =
  state.wallpapers
  .find(

    wall =>
    wall.id
    ===
    id

  );


  state.wallpapers =
  state.wallpapers
  .filter(

    wall =>
    wall.id
    !==
    id

  );


  if(

    item

    &&

    state.currentWallpaper
    ===
    item.image

  ){

    state.currentWallpaper =
    state.wallpapers[0]
    ?.image

    ||

    null;

  }


  save();

  applyWallpaper();

  openWallpaperSettings();

}

function addPage(){

  state.pages
  .push({

    id:
    "p_"
    +
    Date.now(),

    name:
    "Страница "
    +
    (
      state.pages.length
      +
      1
    )

  });


  state.currentPage =
  state.pages.length
  -
  1;


  save();

  render();

  openPageSettings();

}


function removePage(id){

  if(
    state.pages.length
    <=
    1
  ){

    return;

  }


  const target =
  state.pages
  .find(

    page =>
    page.id
    !==
    id

  );


  state.apps
  .forEach(

    app =>{

      if(
        app.pageId
        ===
        id
      ){

        app.pageId =
        target.id;

      }

    }

  );


  state.pages =
  state.pages
  .filter(

    page =>
    page.id
    !==
    id

  );


  state.currentPage =
  0;


  save();

  render();

  openPageSettings();

}

function saveNote(index){

  const notes =
  JSON.parse(

    localStorage.getItem(
      "v4Notes"

    ||

  );


  const note = {

    title:
    document
    .getElementById(
      "noteTitle"
    )
    .value,

    text:
    document
    .getElementById(
      "noteText"
    )
    .value

  };


  if(
    index
    >=
    0
  ){

    notes[index] =
    note;

  }

  else{

    notes.unshift(
      note
    );

  }


  localStorage.setItem(

    "v4Notes",

    JSON.stringify(
      notes
    )

  );


  openNotes();

}

function openCalculator(){

  showSystem(

    "Калькулятор",

    `

    <div

    border-radius:22px;
    ">

      id="calcDisplay"

      value=""

      readonly

      color:#fff;
      text-align:right;
      font-size:38px;
      outline:none;
      ">


      <div

      style="

      repeat(4,1fr);
      gap:9px;
      ">

        ${calcButtons()}

      </div>

    </div>

    `

  );

}


function calcButtons(){

  return [

    "7","8","9","÷",
    "4","5","6","×",
    "1","2","3","−",
    "0",".","=","+",
    "C"

  ]

  .map(

    value =>`

    <button

    onclick="
    calcPress('${value}')
    "

    style="
    height:58px;
    border:0;
    border-radius:50%;
    background:#333;
    color:#fff;
    font-size:22px;
    ">

      ${value}

    </button>

    `

  )
  .join("");

}


function calcPress(value){

  const display =
  document
  .getElementById(
    "calcDisplay"
  );


  if(
    value
    ===
    "C"
  ){

    display.value =
    "";

    return;

  }


  if(
    value
    ===
    "="
  ){

    try{

      let expression =
      display.value

      .replaceAll(
        "×",
        "*"
      )

      .replaceAll(
        "÷",
        "/"
      )

      .replaceAll(
        "−",
        "-"
      );


      display.value =
      Function(

        `"use strict";return (${expression})`

      )();

    }

    catch(error){

      display.value =
      "Ошибка";

    }


    return;

  }


  display.value +=
  value;

}

/* =====================================================
   SEARCH
===================================================== */

function openSearch(){

  const overlay =
  document.getElementById(
    "searchOverlay"
  );


  overlay.innerHTML = `

  <div class="searchbox">

    <input
    id="searchInput"
    placeholder="Поиск"
    autofocus
    oninput="runSearch()">

    <button
    class="search-cancel"
    onclick="closeSearch()">

      Отмена

    </button>

  </div>


  <div
  class="search-results"
  id="searchResults">
  </div>

  `;


  overlay.classList.add(
    "show"
  );


  setTimeout(

    ()=>{

      document
      .getElementById(
        "searchInput"
      )
      ?.focus();

    },

    150

  );


  runSearch();

}


function runSearch(){

  const input =
  document
  .getElementById(
    "searchInput"
  );


  if(
    !input
  ){

    return;

  }


  const query =
  input.value
  .trim()
  .toLowerCase();


  const results =
  state.apps
  .filter(

    app =>
    !query

    ||

    app.title
    .toLowerCase()
    .includes(
      query
    )

  );


  document
  .getElementById(
    "searchResults"
  )
  .innerHTML =

  results
  .map(

    app =>`

    <div
    class="search-item"

    onclick="
    closeSearch();
    launchById('${app.id}')
    ">

      ${iconHTML(app)}

      <div>

        ${safe(app.title)}

      </div>

    </div>

    `

  )
  .join("");

}


function launchById(id){

  const app =
  state.apps
  .find(

    item =>
    item.id
    ===
    id

  );


  if(
    app
  ){

    openApp(app);

  }

}


function closeSearch(){

  const overlay =
  document.getElementById(
    "searchOverlay"
  );


  overlay.classList.remove(
    "show"
  );


  overlay.innerHTML =
  "";

}

/* =====================================================
   SAFE TEXT
===================================================== */

function safe(text){

  return String(
    text
    ??
    ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function attr(text){

  return safe(text)
  .replaceAll(
    "`",
    "&#096;"
  );

}
