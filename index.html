<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<title>Home</title>

<style>
:root{
  --screen-h:100dvh;
  --ios-blue:#0a84ff;
  --ios-bg:#f2f2f7;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  position:fixed;
  inset:0;
  color:#fff;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  appearance:none;
  -webkit-appearance:none;
}

/* =====================================================
   HOME
===================================================== */

#home{
  position:absolute;
  inset:0;

  width:100%;
  height:var(--screen-h);

  overflow:hidden;

  background:
  linear-gradient(
    160deg,
    #556983,
    #28384e 52%,
    #0a1018
  );

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#home::after{
  content:"";
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
  linear-gradient(
    180deg,
    rgba(0,0,0,.015),
    rgba(0,0,0,.02) 63%,
    rgba(0,0,0,.23)
  );
}

/* =====================================================
   SECRET ADMIN
===================================================== */

#adminHotspot{
  position:absolute;

  top:0;
  left:0;

  width:72px;
  height:72px;

  z-index:100;

  background:transparent;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

/* =====================================================
   HOME PAGES
===================================================== */

.pages{
  position:absolute;

  z-index:2;

  left:0;
  right:0;

  top:calc(env(safe-area-inset-top) + 12px);

  bottom:calc(env(safe-area-inset-bottom) + 118px);

  overflow:hidden;
}

.pages-track{
  display:flex;

  width:100%;
  height:100%;

  transition:transform .32s cubic-bezier(.22,.7,.18,1);

  will-change:transform;
}

.page{
  flex:0 0 100%;

  width:100%;
  height:100%;

  padding:23px 18px 20px;

  overflow-y:auto;

  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.app-grid{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  column-gap:12px;
  row-gap:22px;

  align-content:start;
}

/* =====================================================
   APP ICONS
===================================================== */

.app{
  position:relative;

  min-width:0;

  text-align:center;

  user-select:none;
  -webkit-user-select:none;
}

.app-icon{
  position:relative;

  width:min(16.8vw,69px);
  height:min(16.8vw,69px);

  margin:auto;

  overflow:hidden;

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.34),
    rgba(255,255,255,.09)
  );

  border:1px solid rgba(255,255,255,.27);

  box-shadow:
  0 8px 22px rgba(0,0,0,.24),
  inset 0 1px rgba(255,255,255,.55);

  backdrop-filter:blur(17px) saturate(175%);
  -webkit-backdrop-filter:blur(17px) saturate(175%);
}

.app-icon img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
}

.app-name{
  margin-top:6px;

  padding:0 2px;

  color:#fff;

  font-size:11.5px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  text-shadow:0 1px 5px rgba(0,0,0,.82);
}

.brand{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  font-weight:800;
}

.brand-tg{
  background:linear-gradient(145deg,#43b4eb,#168ed1);
  font-size:30px;
}

.brand-inst{
  background:
  radial-gradient(
    circle at 30% 100%,
    #ffd36b 0 19%,
    #ff6864 38%,
    #c13584 62%,
    #405de6 100%
  );

  font-size:30px;
}

.brand-max{
  background:linear-gradient(145deg,#6b65ff,#3832e2);
  font-size:25px;
}

/* =====================================================
   PAGE DOTS
===================================================== */

.page-dots{
  position:absolute;

  z-index:10;

  left:0;
  right:0;

  bottom:calc(env(safe-area-inset-bottom) + 101px);

  display:flex;
  justify-content:center;

  gap:7px;
}

.page-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:rgba(255,255,255,.37);
}

.page-dot.active{
  background:#fff;
}

/* =====================================================
   DOCK
===================================================== */

.dock{
  position:absolute;

  z-index:10;

  left:14px;
  right:14px;

  bottom:max(9px,env(safe-area-inset-bottom));

  height:88px;

  border-radius:29px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.24),
    rgba(255,255,255,.08)
  );

  border:1px solid rgba(255,255,255,.25);

  box-shadow:
  0 10px 30px rgba(0,0,0,.28);

  backdrop-filter:blur(27px) saturate(180%);
  -webkit-backdrop-filter:blur(27px) saturate(180%);
}

.dock .app-icon{
  width:61px;
  height:61px;

  border-radius:17px;
}

.dock .app-name{
  display:none;
}

/* =====================================================
   EDIT MODE
===================================================== */

.editing .app{
  animation:wiggle .18s infinite alternate;
}

@keyframes wiggle{
  from{transform:rotate(-1deg)}
  to{transform:rotate(1deg)}
}

.remove-app{
  display:none;

  position:absolute;

  left:3px;
  top:-6px;

  z-index:20;

  width:24px;
  height:24px;

  border:0;
  border-radius:50%;

  background:rgba(34,34,37,.94);

  color:#fff;

  font-size:18px;
}

.editing .remove-app{
  display:block;
}

.edit-done{
  display:none;

  position:absolute;

  z-index:80;

  top:calc(env(safe-area-inset-top) + 8px);
  right:14px;

  height:36px;

  padding:0 17px;

  border:0;
  border-radius:18px;

  background:rgba(255,255,255,.94);

  color:var(--ios-blue);

  font-weight:700;
}

.editing .edit-done{
  display:block;
}

/* =====================================================
   OVERLAY / SYSTEM
===================================================== */

.overlay{
  display:none;

  position:absolute;
  inset:0;

  z-index:1000;

  overflow:auto;
}

.overlay.show{
  display:block;
}

.system-shell{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  background:var(--ios-bg);

  color:#111;
}

.system-top{
  min-height:64px;

  padding:
  calc(env(safe-area-inset-top) + 10px)
  16px
  10px;

  display:flex;
  align-items:flex-end;

  gap:12px;

  background:rgba(248,248,250,.97);

  border-bottom:1px solid #d8d8dd;
}

.system-back{
  border:0;
  background:none;

  padding:0;

  color:var(--ios-blue);

  font-size:16px;
}

.system-title{
  font-size:21px;
  font-weight:700;
}

.system-body{
  flex:1;

  overflow-y:auto;

  padding:
  18px
  14px
  calc(env(safe-area-inset-bottom) + 25px);
}

.group,
.card{
  overflow:hidden;

  margin-bottom:17px;

  border-radius:14px;

  background:#fff;
}

.row{
  min-height:56px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:8px 13px;

  border-bottom:1px solid #ececf0;
}

.row:last-child{
  border-bottom:0;
}

.row-icon{
  width:32px;
  height:32px;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  background:#6574d8;

  font-size:18px;
}

.row-main{
  flex:1;
  min-width:0;
}

.row-sub{
  margin-top:2px;

  color:#8b8b91;

  font-size:12px;
}

.chevron{
  color:#b0b0b6;

  font-size:22px;
}

/* =====================================================
   BUTTONS
===================================================== */

.primary,
.secondary,
.danger{
  width:100%;

  min-height:48px;

  margin-top:10px;

  border:0;
  border-radius:13px;
}

.primary{
  background:var(--ios-blue);
  color:#fff;
  font-weight:650;
}

.secondary{
  background:#fff;
  color:var(--ios-blue);
}

.danger{
  background:#fff;
  color:#ff3b30;
}

/* =====================================================
   FORM
===================================================== */

.field{
  width:100%;

  min-height:48px;

  margin-top:10px;

  padding:0 13px;

  border:1px solid #d7d7dc;
  border-radius:13px;

  background:#fff;
  color:#111;

  outline:none;
}

textarea.field{
  height:120px;

  padding-top:12px;
}

select.field{
  appearance:auto;
}

/* =====================================================
   AVATAR
===================================================== */

.avatar{
  width:48px;
  height:48px;

  border-radius:50%;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  font-weight:700;

  flex:0 0 auto;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* =====================================================
   WALLPAPER
===================================================== */

.wallpaper-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;
}

.wallpaper{
  position:relative;

  aspect-ratio:9/16;

  border:2px solid transparent;
  border-radius:14px;

  overflow:hidden;

  background-position:center;
  background-size:cover;
}

.wallpaper.selected{
  border-color:var(--ios-blue);
}

.wallpaper-remove{
  position:absolute;

  left:5px;
  top:5px;

  width:25px;
  height:25px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.58);

  color:#fff;
}

/* =====================================================
   TELEGRAM / MAX LIST
===================================================== */

.messenger-shell{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  background:#fff;

  color:#111;
}

.messenger-top{
  min-height:64px;

  padding:
  calc(env(safe-area-inset-top) + 8px)
  14px
  9px;

  display:flex;
  align-items:flex-end;

  gap:10px;

  border-bottom:1px solid #e7e7eb;

  background:#fff;
}

.messenger-title{
  flex:1;

  text-align:center;

  font-size:20px;
  font-weight:700;
}

.messenger-action{
  border:0;

  background:none;

  color:#1996d4;

  font-size:16px;

  padding:0;
}

.max-ui .messenger-action{
  color:#5956f4;
}

.messenger-tabs{
  display:flex;

  gap:7px;

  padding:9px 11px;

  background:#fff;

  border-bottom:1px solid #eee;
}

.messenger-tab{
  border:0;

  padding:7px 12px;

  border-radius:16px;

  background:#ededf2;

  color:#65656b;

  font-size:13px;
}

.messenger-tab.active{
  background:#2aabee;

  color:#fff;
}

.max-ui .messenger-tab.active{
  background:#5d59f6;
}

.chat-list{
  flex:1;

  overflow-y:auto;

  background:#fff;
}

.chat-row{
  min-height:74px;

  display:flex;
  align-items:center;

  gap:11px;

  padding:8px 12px;

  border-bottom:1px solid rgba(0,0,0,.055);
}

.chat-avatar{
  width:55px;
  height:55px;

  flex:0 0 55px;

  border-radius:50%;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  font-weight:700;

  font-size:19px;
}

.chat-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.chat-center{
  flex:1;
  min-width:0;
}

.chat-head{
  display:flex;
  align-items:center;

  gap:5px;
}

.chat-name{
  flex:1;

  min-width:0;

  font-weight:650;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  color:#929298;

  font-size:12px;
}

.chat-preview-row{
  display:flex;
  align-items:center;

  gap:5px;
}

.chat-preview{
  flex:1;

  margin-top:4px;

  color:#85858b;

  font-size:14px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.badge{
  min-width:21px;
  height:21px;

  padding:0 6px;

  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#2aabee;
  color:#fff;

  font-size:12px;
  font-weight:700;
}

.max-ui .badge{
  background:#5d59f6;
}

.pin{
  font-size:12px;
  opacity:.42;
}

.channel-mark{
  font-size:12px;

  color:#999;
}

/* =====================================================
   CHAT SCREEN
===================================================== */

.chat-screen{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  background:#e7eef2;

  color:#111;
}

.max-chat-bg{
  background:#f1f1f5;
}

.chat-top{
  min-height:65px;

  padding:
  calc(env(safe-area-inset-top) + 7px)
  12px
  7px;

  display:flex;
  align-items:flex-end;

  gap:8px;

  background:rgba(250,250,252,.97);

  border-bottom:1px solid #dddde2;
}

.chat-back{
  border:0;

  background:none;

  padding:0 4px 6px 0;

  color:#188ecb;

  font-size:16px;
}

.max-chat-bg .chat-back{
  color:#5b58f4;
}

.chat-person{
  flex:1;

  text-align:center;
}

.chat-person-name{
  font-weight:700;
}

.chat-person-status{
  margin-top:1px;

  color:#929298;

  font-size:11px;
}

.message-area{
  flex:1;

  overflow-y:auto;

  padding:14px;
}

.bubble{
  max-width:79%;

  margin:7px 0;

  padding:9px 12px;

  border-radius:18px;

  line-height:1.35;
}

.bubble.in{
  margin-right:auto;

  background:#fff;

  border-radius:17px 17px 17px 5px;
}

.bubble.out{
  margin-left:auto;

  background:#d9fdd3;

  border-radius:17px 17px 5px 17px;
}

.max-chat-bg .bubble.out{
  background:#6561f5;
  color:#fff;
}

.message-photo{
  display:block;

  width:72%;
  max-width:235px;

  margin:8px 0;

  border-radius:16px;
}

.message-photo.in{
  margin-right:auto;
}

.message-photo.out{
  margin-left:auto;
}

.compose{
  display:flex;

  gap:8px;

  padding:
  10px
  12px
  calc(env(safe-area-inset-bottom) + 8px);

  background:#f8f8fa;

  border-top:1px solid #dddde2;
}

.compose input{
  flex:1;

  height:42px;

  border:1px solid #d7d7dc;
  border-radius:21px;

  padding:0 14px;

  background:#fff;
  color:#111;
}

.compose button{
  height:42px;

  min-width:42px;

  border:0;
  border-radius:21px;

  padding:0 13px;

  background:var(--ios-blue);
  color:#fff;
}

/* =====================================================
   CHANNEL
===================================================== */

.channel-post{
  margin-bottom:12px;

  padding:13px;

  border-radius:15px;

  background:#fff;
}

.channel-post img{
  display:block;

  width:100%;

  margin-top:10px;

  border-radius:12px;
}

.channel-post-meta{
  margin-top:8px;

  color:#96969c;

  font-size:11px;
}

/* =====================================================
   INSTAGRAM-LIKE LOCAL FEED
===================================================== */

.social-shell{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  background:#fff;
  color:#111;
}

.social-top{
  padding:
  calc(env(safe-area-inset-top) + 10px)
  14px
  10px;

  font-size:21px;
  font-weight:800;

  border-bottom:1px solid #eee;
}

.social-close{
  float:right;

  border:0;
  background:none;

  font-size:20px;
}

.stories{
  display:flex;

  gap:12px;

  padding:12px;

  overflow-x:auto;

  border-bottom:1px solid #eee;
}

.story{
  min-width:62px;

  text-align:center;

  font-size:11px;
}

.story-ring{
  width:58px;
  height:58px;

  padding:2px;

  border-radius:50%;

  background:
  linear-gradient(
    145deg,
    #ffb44f,
    #ff375f,
    #804cff
  );
}

.story-ring .avatar{
  width:54px;
  height:54px;

  border:2px solid #fff;
}

.feed{
  flex:1;

  overflow-y:auto;

  padding-bottom:calc(env(safe-area-inset-bottom) + 14px);
}

.post{
  background:#fff;

  border-bottom:1px solid #eee;
}

.post-head{
  display:flex;
  align-items:center;

  gap:9px;

  padding:10px 12px;
}

.post-image{
  width:100%;

  aspect-ratio:1/1;

  object-fit:cover;

  background:#ddd;
}

.post-actions{
  padding:9px 12px;

  font-size:22px;
}

.post-caption{
  padding:0 12px 14px;

  line-height:1.35;
}

/* =====================================================
   APP LIBRARY
===================================================== */

.library-page{
  padding-top:4px;
}

.library-title{
  margin:
  0
  4px
  12px;

  color:#fff;

  font-size:26px;
  font-weight:700;

  text-shadow:0 2px 7px rgba(0,0,0,.35);
}

.library-search{
  width:100%;
  height:42px;

  margin-bottom:14px;

  border:0;
  border-radius:13px;

  padding:0 13px;

  background:rgba(255,255,255,.23);
  color:#fff;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  outline:none;
}

.library-search::placeholder{
  color:rgba(255,255,255,.7);
}

.library-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.library-folder{
  min-height:160px;

  padding:11px;

  border-radius:21px;

  background:rgba(255,255,255,.20);

  border:1px solid rgba(255,255,255,.16);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.library-folder-title{
  margin-bottom:9px;

  color:#fff;

  font-size:13px;
  font-weight:650;

  text-shadow:0 1px 4px rgba(0,0,0,.3);
}

.library-mini-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:8px;
}

.library-mini{
  text-align:center;
}

.library-mini .app-icon{
  width:52px;
  height:52px;

  border-radius:13px;

  font-size:23px;
}

.library-mini .app-name{
  display:none;
}

/* =====================================================
   GENERATOR SETTINGS
===================================================== */

.generator{
  padding:14px;

  margin-bottom:12px;

  border-radius:15px;

  background:#fff;
}

.generator-title{
  margin-bottom:5px;

  font-weight:700;
}

.generator-note{
  color:#85858b;

  font-size:13px;

  line-height:1.4;
}

.generator-buttons{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:12px;
}

.generator-buttons button{
  min-height:44px;

  border:0;
  border-radius:12px;

  font-weight:600;
}

.gen-blue{
  background:var(--ios-blue);
  color:#fff;
}

.gen-gray{
  background:#ededf2;
  color:#111;
}

/* =====================================================
   BROWSER
===================================================== */

.browser-shell{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  background:#000;
}

.browser-frame{
  flex:1;

  width:100%;

  border:0;

  background:#fff;
}
</style>
</head>

<body>

<div id="home">

  <div id="adminHotspot"></div>

  <button
  class="edit-done"
  onclick="finishEditing()">
    Готово
  </button>

  <div
  class="pages"
  id="pagesViewport">

    <div
    class="pages-track"
    id="pagesTrack">
    </div>

  </div>

  <div
  class="page-dots"
  id="pageDots">
  </div>

  <div
  class="dock"
  id="dock">
  </div>

</div>

<div
class="overlay"
id="systemOverlay">
</div>

<div
class="overlay"
id="messengerOverlay">
</div>

<div
class="overlay"
id="socialOverlay">

/* =====================================================
   INDEXED DB
===================================================== */

const DB_NAMES=[
  "GuestDesktopV431",
  "GuestDesktopV42",
  "GuestDesktopAssetsV42"
];

const ACTIVE_DB=
"GuestDesktopV5";

const STORE=
"assets";


function openNamedDB(name){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const request=
      indexedDB.open(
        name,
        1
      );

      request.onupgradeneeded=
      event=>{

        const db=
        event.target.result;

        if(
          !db.objectStoreNames
          .contains(STORE)
        ){

          db.createObjectStore(
            STORE,
            {
              keyPath:"id"
            }
          );

        }

      };

      request.onsuccess=
      ()=>resolve(
        request.result
      );

      request.onerror=
      ()=>reject(
        request.error
      );

    }
  );

}


async function openDB(){

  return await openNamedDB(
    ACTIVE_DB
  );

}


async function saveAsset(
  id,
  blob
){

  const db=
  await openDB();

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const tx=
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(STORE)
      .put({
        id,
        blob
      });

      tx.oncomplete=
      ()=>resolve();

      tx.onerror=
      ()=>reject(
        tx.error
      );

    }
  );

}


async function readAssetFromDB(
  dbName,
  id
){

  try{

    const db=
    await openNamedDB(
      dbName
    );

    if(
      !db.objectStoreNames
      .contains(STORE)
    ){
      return null;
    }

    return await new Promise(
      resolve=>{

        const tx=
        db.transaction(
          STORE,
          "readonly"
        );

        const request=
        tx.objectStore(STORE)
        .get(id);

        request.onsuccess=
        ()=>resolve(
          request.result?.blob
          ||
          null
        );

        request.onerror=
        ()=>resolve(null);

      }
    );

  }

  catch(error){

    return null;

  }

}


async function getAsset(id){

  if(!id){
    return null;
  }

  let blob=
  await readAssetFromDB(
    ACTIVE_DB,
    id
  );

  if(blob){
    return blob;
  }

  for(
    const name
    of DB_NAMES
  ){

    blob=
    await readAssetFromDB(
      name,
      id
    );

    if(blob){

      try{
        await saveAsset(
          id,
          blob
        );
      }catch(e){}

      return blob;

    }

  }

  return null;

}


async function deleteAsset(id){

  if(!id){
    return;
  }

  const db=
  await openDB();

  return new Promise(
    resolve=>{

      const tx=
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(STORE)
      .delete(id);

      tx.oncomplete=
      ()=>resolve();

    }
  );

}


const assetUrls=
new Map();


async function assetUrl(id){

  if(!id){
    return null;
  }

  if(
    assetUrls.has(id)
  ){
    return assetUrls.get(id);
  }

  const blob=
  await getAsset(id);

  if(!blob){
    return null;
  }

  const url=
  URL.createObjectURL(blob);

  assetUrls.set(
    id,
    url
  );

  return url;

}


/* =====================================================
   IMAGE COMPRESS
===================================================== */

function compressFile(
  file,
  maxWidth,
  maxHeight,
  quality=.82
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const reader=
      new FileReader();

      reader.onload=
      ()=>{

        const image=
        new Image();

        image.onload=
        ()=>{

          let width=
          image.width;

          let height=
          image.height;

          const ratio=
          Math.min(
            maxWidth/width,
            maxHeight/height,
            1
          );

          width=
          Math.round(
            width*ratio
          );

          height=
          Math.round(
            height*ratio
          );

          const canvas=
          document.createElement(
            "canvas"
          );

          canvas.width=
          width;

          canvas.height=
          height;

          canvas
          .getContext("2d")
          .drawImage(
            image,
            0,
            0,
            width,
            height
          );

          canvas.toBlob(
            blob=>{
              if(blob){
                resolve(blob);
              }else{
                reject();
              }
            },
            "image/jpeg",
            quality
          );

        };

        image.onerror=
        reject;

        image.src=
        reader.result;

      };

      reader.onerror=
      reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(text){

  return String(
    text ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function attr(text){

  return safe(text)
  .replaceAll(
    "`",
    "&#096;"
  );

}

/* =====================================================
   LOAD / MIGRATION
===================================================== */

function cloneDefault(){

  return JSON.parse(
    JSON.stringify(
      DEFAULT_STATE
    )
  );

}


function loadState(){

  try{

    const raw=
    localStorage.getItem(
      "iosGuestV42"
    );

    if(!raw){
      return cloneDefault();
    }

    const saved=
    JSON.parse(raw);

    const base=
    cloneDefault();

    const state={
      ...base,
      ...saved,

      pages:
      Array.isArray(saved.pages)
      &&
      saved.pages.length
      ?
      saved.pages
      :
      base.pages,

      apps:
      Array.isArray(saved.apps)
      ?
      saved.apps
      :
      base.apps,

      dock:
      Array.isArray(saved.dock)
      ?
      saved.dock
      :
      base.dock,

      chats:{
        ...base.chats,
        ...(saved.chats || {})
      },

      stories:
      Array.isArray(saved.stories)
      ?
      saved.stories
      :
      base.stories,

      posts:
      Array.isArray(saved.posts)
      ?
      saved.posts
      :
      base.posts
    };

    return state;

  }

  catch(error){

    return cloneDefault();

  }

}


let state=
loadState();


function migrateState(){

  ["telegram","max"]
  .forEach(
    kind=>{

      if(
        !Array.isArray(
          state.chats[kind]
        )
      ){

        state.chats[kind]=[];

      }

      state.chats[kind]
      .forEach(
        (
          chat,
          index
        )=>{

          chat.kind=
          chat.kind
          ||
          "chat";

          chat.avatarSeed=
          Number.isFinite(
            chat.avatarSeed
          )
          ?
          chat.avatarSeed
          :
          index+1;

          chat.time=
          chat.time
          ||
          randomTime();

          chat.unread=
          Number.isFinite(
            chat.unread
          )
          ?
          chat.unread
          :
          0;

          chat.pinned=
          !!chat.pinned;

          chat.messages=
          Array.isArray(
            chat.messages
          )
          ?
          chat.messages
          :
          [];

          chat.posts=
          Array.isArray(
            chat.posts
          )
          ?
          chat.posts
          :
          [];

        }
      );

    }
  );


  state.apps.forEach(
    app=>{

      app.category=
      app.category
      ||
      guessCategory(app);

    }
  );

}


function saveState(){

  try{

    localStorage.setItem(
      "iosGuestV42",
      JSON.stringify(state)
    );

  }

  catch(error){

    alert(
      "Не удалось сохранить настройки."
    );

  }

}


function guessCategory(app){

  if(
    ["telegram","instagram","max"]
    .includes(app.type)
  ){
    return "Социальные";
  }

  if(
    ["music","games"]
    .includes(app.id)
  ){
    return "Развлечения";
  }

  if(
    app.type==="photos"
  ){
    return "Фото и видео";
  }

  if(
    app.type==="notes"
  ){
    return "Продуктивность";
  }

  return "Утилиты";

}


/* =====================================================
   AVATAR GENERATOR
===================================================== */

const avatarGradients=[

  ["#5e9cff","#7655e8"],
  ["#ff8b63","#ff4d82"],
  ["#32bda5","#3788d8"],
  ["#f2a544","#df6f34"],
  ["#7367f0","#ad59db"],
  ["#3095d8","#36c2b3"],
  ["#e25c85","#7e61cf"],
  ["#6aa04e","#2a9c84"],
  ["#cc7a49","#e7ac49"],
  ["#5966c8","#438dde"]

];


function avatarStyle(seed=1){

  const pair=
  avatarGradients[
    Math.abs(seed)
    %
    avatarGradients.length
  ];

  return `
    background:
    linear-gradient(
      145deg,
      ${pair[0]},
      ${pair[1]}
    )
  `;

}


function initials(name){

  const parts=
  String(name || "?")
  .trim()
  .split(/\s+/)
  .filter(Boolean);

  if(!parts.length){
    return "?";
  }

  return parts
  .slice(0,2)
  .map(
    part=>
    part[0]
    .toUpperCase()
  )
  .join("");

}

  }

  return safe(

}

      </div>
    `;

  `;

}


async function hydrateAppImages(){

  const nodes=
  document.querySelectorAll(
    "[data-image-id]"
  );

  for(
    const node
    of nodes
  ){

    const id=
    node.dataset.imageId;

    if(
      !id
      ||
      node.querySelector("img")
    ){
      continue;
    }

    const url=
    await assetUrl(id);

    if(url){

      const img=
      document.createElement(
        "img"
      );

      img.src=url;

      node.appendChild(img);

    }

  }

}


/* =====================================================
   CREATE APP TILE
===================================================== */

function createAppTile(
  app,
  library=false
){

  const element=
  document.createElement(
    "div"
  );

  element.className=
  library
  ?
  "library-mini app"
  :
  "app";

  element.innerHTML=`

    ${
      !library
      &&
      app.removable !== false
      ?
      `
      <button
      class="remove-app">
        −
      </button>
      `
      :
      ""
    }

    ${iconHTML(app)}

    <div class="app-name">
      ${safe(app.title)}
    </div>
  `;


  const remove=
  element.querySelector(
    ".remove-app"
  );

  if(remove){

    remove.onclick=
    async event=>{

      event.stopPropagation();

      if(app.imageId){
        await deleteAsset(
          app.imageId
        );
      }

      state.apps=
      state.apps.filter(
        item=>
        item.id!==app.id
      );

      saveState();

      renderHome();

    };

  }


  element.onclick=
  ()=>{

    if(
      state.editing
      &&
      !library
    ){
      return;
    }

    openApp(app);

  };


  return element;

}

  );

  );

  dock.innerHTML="";

  state.pages.length + 1;


  state.currentPage=
  Math.max(
    0,
    Math.min(
      state.currentPage,
      totalPages-1
    )
  );


  state.pages.forEach(
    (
      page,
      index
    )=>{

      const pageEl=
      document.createElement(
        "section"
      );

      pageEl.className=
      "page";

        "div"
      );

      grid.className=
      "app-grid";


      state.apps

        app=>
        app.pageId===page.id
      )
      .forEach(
        app=>{

          grid.appendChild(
            createAppTile(app)
          );

        }
      );


      pageEl.appendChild(

      );

      track.appendChild(
        pageEl
      );


      const dot=
      document.createElement(
        "div"
      );

      (
        index===state.currentPage

    buildAppLibrary()
  );

  document.createElement(
    "div"
  );

  (
    state.currentPage===
    totalPages-1
    ?
    " active"
    :
    ""
  );

  dots.appendChild(
    libraryDot
  );


  state.dock.forEach(
    app=>{

      dock.appendChild(
        createAppTile(app)
      );

    }
  );


  document
  .getElementById(
    "home"
  )
  .classList.toggle(
    "editing",

  );

  hydrateAppImages();

}

    ()=>{

          "input",

  const query=
  document
  .getElementById(
    "librarySearch"

  ?.value
  .trim()
  .toLowerCase()
  ||
  "";


  const apps=
  state.apps.filter(
    app=>
    !query
    ||
    app.title
    .toLowerCase()
    .includes(query)
  );


  const categories={};


  apps.forEach(
    app=>{

      const category=
      app.category
      ||
      guessCategory(app);

      if(!categories[category]){
        categories[category]=[];
      }

      categories[category]
      .push(app);

    }
  );


  box.innerHTML="";


  Object.entries(
    categories
  )
  .forEach(
    (
      [
        title,
        apps
      ]
    )=>{

      const folder=
      document.createElement(
        "div"
      );

      folder.className=
      "library-folder";


      const heading=
      document.createElement(
        "div"
      );

      heading.className=
      "library-folder-title";

      heading.textContent=
      title;


      const grid=
      document.createElement(
        "div"
      );

      grid.className=
      "library-mini-grid";


      apps
      .slice(0,4)
      .forEach(
        app=>{

          grid.appendChild(
            createAppTile(
              app,
              true
            )
          );

        }
      );


      folder.appendChild(
        heading
      );

      folder.appendChild(
        grid
      );

      box.appendChild(
        folder
      );

    }
  );


  hydrateAppImages();

}

const viewport=
document.getElementById(
  "pagesViewport"
);


let startX=0;
let startY=0;


viewport.addEventListener(
  "touchstart",
  event=>{

    startX=
    event.touches[0]
    .clientX;

    startY=
    event.touches[0]
    .clientY;

  },
  {
    passive:true
  }
);


viewport.addEventListener(
  "touchend",
  event=>{

    const touch=
    event.changedTouches[0];

    const dx=
    touch.clientX-startX;

    const dy=
    touch.clientY-startY;


    if(
      Math.abs(dx)<45
      ||
      Math.abs(dx)
      <
      Math.abs(dy)
    ){
      return;
    }


    const maxPage=
    state.pages.length;


    if(
      dx<0
      &&
      state.currentPage<maxPage
    ){

      state.currentPage++;

    }

    else if(
      dx>0
      &&
      state.currentPage>0
    ){

      state.currentPage--;

    }


    saveState();

    updatePage(true);

  },
  {
    passive:true
  }
);


function updatePage(
  animate=true
){

  const track=
  document.getElementById(
    "pagesTrack"
  );

  track.style.transition=
  animate
  ?
  "transform .32s cubic-bezier(.22,.7,.18,1)"
  :
  "none";

  track.style.transform=
  `translateX(-${state.currentPage*100}%)`;


  document
  .querySelectorAll(
    ".page-dot"
  )
  .forEach(
    (
      dot,
      index
    )=>{

      dot.classList.toggle(
        "active",
        index===state.currentPage
      );

    }
  );

}

    case "notes":

      openNotes();

    case "url":

      if(
        /^https?:\/\//i
        .test(app.url)

        openBrowser(
          app.url,
          app.title
        );

      }

      else if(app.url){

        app.url;

      }

      break;

  }

}

async function openWallpaperSettings(){

  let html=
  `<div class="wallpaper-grid">`;


  for(
    const wallpaper
    of state.wallpapers
  ){

    const url=
    await assetUrl(
      wallpaper.id
    );

    if(!url){
      continue;
    }


    html+=`

      <div
      class="
      wallpaper
      ${
        state.currentWallpaperId===
        wallpaper.id
        ?
        "selected"
        :
        ""
      }
      "

      style="
      background-image:
      url('${url}')
      "

      onclick="
      selectWallpaper(
        '${wallpaper.id}'
      )
      ">

        <button
        class="wallpaper-remove"
        onclick="
        event.stopPropagation();
        removeWallpaper(
          '${wallpaper.id}'
        )
        ">
          ×
        </button>

      </div>
    `;

  }


  html+=
  `</div>`;


  html+=`

    <button
    class="primary"
    onclick="
    document
    .getElementById(
      'wallpaperInput'
    )
    .click()
    ">
      Добавить обои
    </button>
  `;


  showSystem(
    "Обои",
    html,
    "openSettings()"
  );

}


document
.getElementById(
  "wallpaperInput"
)
.addEventListener(
  "change",
  async function(){

    const file=
    this.files[0];

    if(!file){
      return;
    }


    const blob=
    await compressFile(
      file,
      1179,
      2556,
      .80
    );


    const id=
    "wall_"
    +
    Date.now();


    await saveAsset(
      id,
      blob
    );


    state.wallpapers.push({
      id
    });


    state.currentWallpaperId=
    id;


    saveState();

    await applyWallpaper();

    await openWallpaperSettings();


    this.value="";

  }
);


async function selectWallpaper(id){

  state.currentWallpaperId=id;

  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}


async function removeWallpaper(id){

  await deleteAsset(id);

  state.wallpapers=
  state.wallpapers.filter(
    item=>
    item.id!==id
  );


  if(
    state.currentWallpaperId===id
  ){

    state.currentWallpaperId=
    state.wallpapers[0]?.id
    ||
    null;

  }


  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}

function rand(array){

  return array[
    Math.floor(
      Math.random()
      *
      array.length
    )
  ];

}


function randInt(
  min,
  max
){

  return Math.floor(
    Math.random()
    *
    (
      max-min+1
    )
  )
  +
  min;

}


function randomTime(){

  const now=
  new Date();


  const date=
  new Date(
    now.getTime()
    -
    randInt(
      3,
      4000
    )
    *
    60000
  );


  if(
    date.toDateString()===
    now.toDateString()
  ){

    return date
    .toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  const yesterday=
  new Date(
    now.getTime()
    -
    86400000
  );


  if(
    date.toDateString()===
    yesterday.toDateString()
  ){
    return "вчера";
  }


  return date
  .toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}

  for(

    result.push({

      side:
      Math.random()>.48
      ?
      "out"
      :
      "in",

      text:
      rand(

      ),

      photoId:null

  }


  return result;

}

      name,

function addRandomActivity(
  kind
){

  const items=
  state.chats[kind]
  ||
  [];


  if(!items.length){

    addGeneratedChats(
      kind,
      10
    );

    return;

  }


  const selection=
  [...items]
  .sort(
    ()=>Math.random()-.5
  )
  .slice(
    0,
    Math.min(
      randInt(3,8),
      items.length
    )
  );


  selection.forEach(
    item=>{

      if(
        item.kind==="channel"
      ){

        const post={

          id:
          "post_"
          +
          Date.now()
          +
          "_"
          +
          Math.random(),

          text:
          rand(channelTexts),

          imageId:null,

          views:
          randInt(
            100,
            9000
          ),

          time:
          new Date()
          .toLocaleTimeString(
            "ru-RU",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          )

        };


        item.posts.unshift(
          post
        );

        item.last=
        post.text;

      }

      else{

        const incoming=
        Math.random()>.3;


        const message={

          side:
          incoming
          ?
          "in"
          :
          "out",

          text:
          rand(randomMessages),

          photoId:null

        };


        item.messages.push(
          message
        );

        item.last=
        message.text;


        if(incoming){

          item.unread=
          (
            item.unread
            ||
            0
          )
          +
          1;

        }

      }


      item.time=
      new Date()
      .toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }
  );


  state.chats[kind]=
  [
    ...selection,
    ...items.filter(
      item=>
      !selection.includes(item)
    )
  ];


  saveState();

  openContentEditor(kind);

}

async function openConversation(
  kind,
  id
){

  const item=
  state.chats[kind]
  .find(
    chat=>
    chat.id===id
  );

  if(!item){
    return;
  }


  item.unread=0;

  saveState();


  if(
    item.kind==="channel"
  ){

    openChannel(
      kind,
      item
    );

    return;

  }


  let messages="";


  for(
    const message
    of item.messages
  ){

    if(message.photoId){

      const url=
      await assetUrl(
        message.photoId
      );

      if(url){

        messages+=`

          <img
          class="
          message-photo
          ${message.side}
          "
          src="${url}">
        `;

      }

    }


    if(message.text){

      messages+=`

        <div
        class="
        bubble
        ${message.side}
        ">

          ${safe(message.text)}

        </div>
      `;

    }

  }


  const overlay=
  document.getElementById(
    "messengerOverlay"
  );


  overlay.innerHTML=`

    <div
    class="
    chat-screen
    ${
      kind==="max"
      ?
      "max-chat-bg"
      :
      ""
    }
    ">

      <div class="chat-top">

        <button
        class="chat-back"

        onclick="
        openMessenger(
          '${kind}',
          '${currentMessengerFilter}'
        )
        ">
          ‹ Чаты
        </button>


        <div class="chat-person">

          <div class="chat-person-name">

            ${safe(item.name)}

          </div>

          <div class="chat-person-status">

            ${
              kind==="telegram"
              ?
              "был(а) недавно"
              :
              "в сети"
            }

          </div>

        </div>

        <div style="width:44px">
        </div>

      </div>


      <div
      class="message-area"
      id="messageArea">

        ${messages}

      </div>


      <div class="compose">

        <input
        id="messageInput"
        placeholder="Сообщение">

        <button
        onclick="
        sendMessage(
          '${kind}',
          '${id}'
        )
        ">
          ↑
        </button>

      </div>

    </div>
  `;


  overlay.classList.add(
    "show"
  );


  setTimeout(
    ()=>{

      const area=
      document.getElementById(
        "messageArea"
      );

      if(area){

        area.scrollTop=
        area.scrollHeight;

      }

    },
    0
  );

}


function sendMessage(
  kind,
  id
){

  const input=
  document.getElementById(
    "messageInput"
  );

  const text=
  input.value.trim();

  if(!text){
    return;
  }


  const item=
  state.chats[kind]
  .find(
    chat=>
    chat.id===id
  );


  item.messages.push({

    side:"out",

    text,

    photoId:null

  });


  item.last=text;


  item.time=
  new Date()
  .toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );


  saveState();

  openConversation(
    kind,
    id
  );

}

function openPageSettings(){

  const rows=
  state.pages

    page=>`

          <div class="row-sub">

          onclick="
          removePage(
            '${page.id}'
          )
          ">
            Удалить
          </button>
          `
          :
          ""
        }

      </div>
    `
  )
  .join("");


  showSystem(

    `

      Библиотека приложений всегда находится последней страницей.

function addPage(){

  state.pages.push({

    id:
    "page_"
    +
    Date.now(),

    name:
    "Страница "
    +
    (
      state.pages.length+1
    )

  });


  state.currentPage=
  state.pages.length-1;


  saveState();

  renderHome();

  openPageSettings();

}


function removePage(id){

  if(
    state.pages.length<=1
  ){
    return;
  }


  const target=
  state.pages.find(
    page=>
    page.id!==id
  );


  state.apps.forEach(
    app=>{

      if(
        app.pageId===id
      ){

        app.pageId=
        target.id;

      }

    }
  );


  state.pages=
  state.pages.filter(
    page=>
    page.id!==id
  );


  state.currentPage=0;


  saveState();

  renderHome();

  openPageSettings();

}

let iconTargetAppId=null;

function selectAppIcon(id){

  iconTargetAppId=id;

  document
  .getElementById(
    "iconInput"
  )
  .click();

}


document
.getElementById(
  "iconInput"
)
.addEventListener(
  "change",
  async function(){

    const file=
    this.files[0];

    if(!file){
      return;
    }


    const blob=
    await compressFile(
      file,
      512,
      512,
      .90
    );


    if(iconTargetAppId){

      const app=
      state.apps.find(
        item=>
        item.id===iconTargetAppId
      );


      if(app){

        if(app.imageId){
          await deleteAsset(
            app.imageId
          );
        }


        const id=
        "icon_"
        +
        Date.now();


        await saveAsset(
          id,
          blob
        );


        app.imageId=id;


        saveState();

        renderHome();

        openAppSettings();

      }


      iconTargetAppId=null;

    }

    else{

      pendingNewIcon=
      blob;

    }


    this.value="";

  }
);


function openAddApp(){

  const pages=
  state.pages
  .map(
    page=>`
      <option value="${page.id}">
        ${safe(page.name)}

  showSystem(

      </option>

    <button

    onclick="
    document
    .getElementById(
      'iconInput'
    )
    .click()
    ">
      Выбрать иконку
    </button>

    <button
    class="primary"
    onclick="saveNewApp()">
      Добавить
    </button>
    `,

    "openAppSettings()"

  );

}


async function saveNewApp(){

  const title=
  document
  .getElementById(
    "newAppTitle"
  )
  .value
  .trim();


  if(!title){
    return;
  }


  let imageId=null;


  if(pendingNewIcon){

    imageId=
    "custom_icon_"
    +
    Date.now();

    await saveAsset(
      imageId,
      pendingNewIcon
    );

    pendingNewIcon=null;

  }


  state.apps.push({

    id:
    "custom_"
    +
    Date.now(),

    title,

    type:"url",

    icon:"⭐",

    imageId,

    pageId:
    document
    .getElementById(
      "newAppPage"
    )
    .value,

    category:
    document
    .getElementById(
      "newAppCategory"
    )
    .value,

    url:
    document
    .getElementById(
      "newAppUrl"
    )
    .value
    .trim(),

    removable:true

  });


  saveState();

  renderHome();

  openAppSettings();

}

function editNote(index){

  const notes=
  JSON.parse(
    localStorage.getItem(
      "v5Notes"
    )
    ||
    "[]"
  );


  const note=
  index>=0
  ?
  notes[index]
  :
  {
    title:"",
    text:""
  };


  showSystem(

    "Заметка",

    `

    <input
    class="field"
    id="noteTitle"
    placeholder="Название"
    value="${attr(note.title)}">

    <textarea
    class="field"
    id="noteText"
    placeholder="Текст">${safe(note.text)}</textarea>

    <button
    class="primary"
    onclick="
    saveNote(
      ${index}
    )
    ">
      Сохранить
    </button>
    `,

    "openNotes()"

  );

}


function saveNote(index){

  const notes=
  JSON.parse(
    localStorage.getItem(
      "v5Notes"
    )
    ||
    "[]"
  );


  const note={

    title:
    document
    .getElementById(
      "noteTitle"
    )
    .value,

    text:
    document
    .getElementById(
      "noteText"
    )
    .value

  };


  if(index>=0){

    notes[index]=note;

  }

  else{

    notes.unshift(note);

  }


  localStorage.setItem(
    "v5Notes",
    JSON.stringify(notes)
  );


  openNotes();

}
