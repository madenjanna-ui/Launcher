<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Home</title>

<style>
:root{
  --glass: rgba(255,255,255,.18);
  --glass2: rgba(255,255,255,.09);
  --line: rgba(255,255,255,.28);
  --text:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

button,input,select,textarea{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

/* ===== FULLSCREEN HOME ===== */

#home{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-height:100svh;
  min-height:100dvh;
  overflow:hidden;

  background:
    linear-gradient(160deg,#53657a,#263548 50%,#0b1119);

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#home::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.05),
      rgba(0,0,0,.02) 45%,
      rgba(0,0,0,.26)
    );
}

/* ===== TOP CLOCK ===== */

.hero{
  position:relative;
  z-index:3;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    22px 8px;
  user-select:none;
  -webkit-user-select:none;
}

.hero-time{
  font-size:58px;
  line-height:.95;
  font-weight:250;
  letter-spacing:-3px;
  text-shadow:0 2px 14px rgba(0,0,0,.35);
}

.hero-date{
  margin-top:8px;
  font-size:16px;
  opacity:.92;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

/* ===== PAGES ===== */

.pages-viewport{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  top:calc(env(safe-area-inset-top) + 130px);
  bottom:calc(env(safe-area-inset-bottom) + 132px);
  overflow:hidden;
  touch-action:pan-y;
}

.pages-track{
  height:100%;
  display:flex;
  transition:transform .32s cubic-bezier(.22,.7,.18,1);
  will-change:transform;
}

.page{
  flex:0 0 100%;
  width:100%;
  height:100%;
  padding:18px 18px 12px;
  overflow-y:auto;
  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.app-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px 12px;
  align-content:start;
}

/* ===== APP ICON ===== */

.app{
  min-width:0;
  text-align:center;
  user-select:none;
  cursor:pointer;
}

.app-icon{
  width:min(17vw,72px);
  height:min(17vw,72px);
  margin:auto;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.08));

  border:1px solid rgba(255,255,255,.28);

  box-shadow:
    0 10px 28px rgba(0,0,0,.25),
    inset 0 1px 1px rgba(255,255,255,.65),
    inset 0 -1px 1px rgba(255,255,255,.08);

  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);

  transition:transform .12s ease,filter .12s ease;
}

.app-icon::before{
  content:"";
  position:absolute;
  top:-30%;
  left:-15%;
  width:85%;
  height:65%;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  filter:blur(8px);
  transform:rotate(-12deg);
  pointer-events:none;
}

.app-icon img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.app-icon .emoji{
  position:relative;
  z-index:2;
}

.app:active .app-icon{
  transform:scale(.89);
  filter:brightness(.9);
}

.app-name{
  margin-top:7px;
  padding:0 2px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 5px rgba(0,0,0,.78);
}

/* ===== PAGE DOTS ===== */

.page-dots{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 108px);
  display:flex;
  justify-content:center;
  gap:7px;
  pointer-events:none;
}

.page-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(255,255,255,.38);
  transition:.2s;
}

.page-dot.active{
  background:#fff;
  transform:scale(1.08);
}

/* ===== DOCK ===== */

.dock{
  position:absolute;
  z-index:5;
  left:14px;
  right:14px;
  bottom:max(10px,env(safe-area-inset-bottom));
  height:90px;
  border-radius:30px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:
    linear-gradient(145deg,rgba(255,255,255,.23),rgba(255,255,255,.07));

  border:1px solid rgba(255,255,255,.25);

  box-shadow:
    0 12px 35px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.3);

  backdrop-filter:blur(28px) saturate(175%);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
}

.dock .app-icon{
  width:62px;
  height:62px;
  border-radius:18px;
  font-size:28px;
}

.dock .app-name{
  display:none;
}

/* ===== SETTINGS ===== */

.overlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(7,8,12,.72);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  overflow-y:auto;
  padding:
    calc(env(safe-area-inset-top) + 22px)
    16px
    calc(env(safe-area-inset-bottom) + 24px);
}

.overlay.show{
  display:block;
}

.panel{
  max-width:440px;
  margin:auto;
  border-radius:28px;
  padding:20px;
  background:rgba(34,34,41,.8);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 18px 50px rgba(0,0,0,.42);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.panel-title{
  font-size:24px;
  font-weight:700;
  margin:0 0 20px;
}

.section-title{
  margin:22px 2px 10px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.75px;
  opacity:.55;
}

.btn{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:15px;
  margin-top:10px;
  background:#fff;
  color:#111;
  font-weight:650;
}

.btn.secondary{
  color:#fff;
  background:rgba(255,255,255,.1);
}

.btn.danger{
  color:#ffb3ad;
  background:rgba(255,59,48,.14);
}

/* ===== WALLPAPERS ===== */

.wallpaper-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.wallpaper{
  aspect-ratio:9/16;
  border-radius:15px;
  background:center/cover no-repeat;
  position:relative;
  overflow:hidden;
  border:2px solid transparent;
}

.wallpaper.selected{
  border-color:#fff;
}

.wallpaper.selected::after{
  content:"✓";
  position:absolute;
  right:6px;
  top:6px;
  width:24px;
  height:24px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#111;
  font-weight:800;
}

.mini-x{
  position:absolute;
  left:6px;
  top:6px;
  width:24px;
  height:24px;
  border-radius:50%;
  border:0;
  background:rgba(0,0,0,.55);
  color:#fff;
}

/* ===== PAGE SETTINGS ===== */

.page-row,
.app-row{
  min-height:58px;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.row-left{
  min-width:0;
  flex:1;
}

.row-title{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.row-sub{
  margin-top:3px;
  font-size:12px;
  opacity:.5;
}

.row-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.small-btn{
  border:0;
  min-width:36px;
  height:36px;
  padding:0 10px;
  border-radius:11px;
  background:rgba(255,255,255,.1);
  color:#fff;
}

.small-btn.red{
  color:#ffb3ad;
  background:rgba(255,59,48,.15);
}

/* ===== SWITCH ===== */

.switch{
  width:49px;
  height:29px;
  padding:3px;
  border-radius:18px;
  background:rgba(255,255,255,.18);
  transition:.2s;
}

.switch-knob{
  width:23px;
  height:23px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:#34c759;
}

.switch.on .switch-knob{
  transform:translateX(20px);
}

/* ===== FORMS ===== */

.form{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,.07);
}

.form.show{
  display:block;
}

.input,
.select,
.textarea{
  width:100%;
  margin-top:10px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:rgba(255,255,255,.08);
  color:#fff;
  outline:none;
}

.input,
.select{
  height:48px;
  padding:0 13px;
}

.textarea{
  min-height:100px;
  padding:12px 13px;
  resize:vertical;
}

.select option{
  color:#111;
}

.icon-pick{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-top:10px;
}

.icon-choice{
  height:44px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:rgba(255,255,255,.07);
  border:1px solid transparent;
}

.icon-choice.selected{
  border-color:#fff;
  background:rgba(255,255,255,.16);
}

.custom-icon-preview{
  width:72px;
  height:72px;
  margin-top:10px;
  border-radius:18px;
  overflow:hidden;
  display:none;
  background:rgba(255,255,255,.08);
}

.custom-icon-preview.show{
  display:block;
}

.custom-icon-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== BUILT-IN APPS ===== */

#builtinOverlay{
  padding:0;
  background:#f2f2f7;
  color:#111;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}

.builtin-shell{
  position:absolute;
  inset:0;
  background:#f2f2f7;
  color:#111;
  display:flex;
  flex-direction:column;
}

.builtin-top{
  padding:
    calc(env(safe-area-inset-top) + 10px)
    16px
    10px;
  min-height:64px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  background:rgba(248,248,250,.92);
  border-bottom:1px solid #d8d8dc;
}

.back-btn{
  border:0;
  background:none;
  padding:0;
  color:#007aff;
  font-size:16px;
}

.builtin-title{
  font-size:20px;
  font-weight:700;
}

.builtin-body{
  flex:1;
  overflow-y:auto;
  padding:14px;
}

.card{
  border-radius:16px;
  background:#fff;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}

.chat-row,
.contact-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid #ececf0;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(145deg,#7aa7ff,#836dff);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat-main{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:650;
}

.chat-last{
  margin-top:3px;
  color:#74747a;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bubble{
  max-width:78%;
  padding:9px 12px;
  border-radius:17px;
  margin:7px 0;
  line-height:1.35;
  font-size:15px;
}

.bubble.in{
  background:#e9e9ee;
  margin-right:auto;
}

.bubble.out{
  background:#2f80ff;
  color:#fff;
  margin-left:auto;
}

.compose{
  display:flex;
  gap:8px;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 8px);
  background:#f8f8fa;
  border-top:1px solid #dddde2;
}

.compose input{
  flex:1;
  height:42px;
  border:1px solid #d7d7dc;
  border-radius:21px;
  padding:0 14px;
  background:#fff;
  color:#111;
}

.compose button{
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#007aff;
  color:#fff;
}

.social-post{
  background:#fff;
  margin-bottom:14px;
  border-radius:15px;
  overflow:hidden;
}

.social-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
}

.social-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#ddd;
}

.social-text{
  padding:12px;
  line-height:1.35;
}

.note-item{
  background:#fff;
  border-radius:13px;
  padding:13px;
  margin-bottom:9px;
}

/* ===== HELPERS ===== */

.muted{
  opacity:.55;
  font-size:13px;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="home">

  <div class="hero" id="secretHotspot">
    <div class="hero-time" id="heroTime">11:01</div>
    <div class="hero-date" id="heroDate"></div>
  </div>

  <div class="pages-viewport" id="pagesViewport">
    <div class="pages-track" id="pagesTrack"></div>
  </div>

  <div class="page-dots" id="pageDots"></div>

  <div class="dock" id="dock"></div>

</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <div class="panel-title">Настройки</div>

    <div class="section-title">Обои</div>
    <div class="wallpaper-grid" id="wallpaperGrid"></div>
    <input id="wallpaperInput" type="file" accept="image/*" hidden>
    <button class="btn" onclick="document.getElementById('wallpaperInput').click()">＋ Добавить обои</button>

    <div class="section-title">Страницы</div>
    <div id="pageSettings"></div>
    <button class="btn" onclick="addPage()">＋ Добавить страницу</button>

    <div class="section-title">Приложения</div>
    <div id="appSettings"></div>
    <button class="btn" onclick="toggleAppForm()">＋ Добавить приложение</button>

    <div class="form" id="appForm">
      <input class="input" id="newAppTitle" placeholder="Название">

      <select class="select" id="newAppPage"></select>

      <select class="select" id="newAppType" onchange="updateTypeFields()">
        <option value="url">Открыть ссылку / приложение</option>
        <option value="messages">Встроенные сообщения</option>
        <option value="contacts">Встроенные контакты</option>
        <option value="social">Встроенная лента</option>
        <option value="notes">Встроенные заметки</option>
      </select>

      <input class="input" id="newAppUrl" placeholder="https://... или URL-схема">

      <div class="section-title">Значок</div>
      <div class="icon-pick" id="emojiPicker"></div>

      <input id="iconFileInput" type="file" accept="image/*" hidden>
      <button class="btn secondary" onclick="document.getElementById('iconFileInput').click()">Выбрать свою иконку</button>
      <div class="custom-icon-preview" id="customIconPreview"></div>

      <button class="btn" onclick="addApp()">Добавить</button>
    </div>

    <button class="btn secondary" onclick="closeSettings()">Готово</button>
  </div>
</div>

<!-- BUILT-IN APP OVERLAY -->
<div class="overlay" id="builtinOverlay"></div>

<script>
/* =========================================================
   STATE
========================================================= */

const emojiChoices = [
  "🎵","📅","💬","🎮","📊","📝","🖼️","🗺️",
  "🌐","📞","📷","🧮","📁","📚","✉️","🚗",
  "🎬","📺","☁️","⭐","👤","📸","🎧","⚙️"
];

const defaultState = {
  currentPage: 0,
  pages: [
    { id:"page_1", name:"Страница 1" }
  ],
  apps: [
    {
      id:"music",
      title:"Музыка",
      icon:"🎵",
      iconImage:null,
      type:"url",
      url:"https://madenjanna-ui.github.io/Music-edition/",
      pageId:"page_1",
      enabled:true,
      removable:false
    },
    {
      id:"games",
      title:"Игры",
      icon:"🎮",
      iconImage:null,
      type:"url",
      url:"https://madenjanna-ui.github.io/Avtoslalom/",
      pageId:"page_1",
      enabled:true,
      removable:false
    },
    {
      id:"messages",
      title:"Сообщения",
      icon:"💬",
      iconImage:null,
      type:"messages",
      url:"",
      pageId:"page_1",
      enabled:true,
      removable:true
    },
    {
      id:"contacts",
      title:"Контакты",
      icon:"👤",
      iconImage:null,
      type:"contacts",
      url:"",
      pageId:"page_1",
      enabled:true,
      removable:true
    },
    {
      id:"social",
      title:"Лента",
      icon:"📸",
      iconImage:null,
      type:"social",
      url:"",
      pageId:"page_1",
      enabled:true,
      removable:true
    },
    {
      id:"notes",
      title:"Заметки",
      icon:"📝",
      iconImage:null,
      type:"notes",
      url:"",
      pageId:"page_1",
      enabled:true,
      removable:true
    }
  ],
  dock: [
    { id:"dock_phone", title:"Телефон", icon:"📞", type:"url", url:"tel:", iconImage:null },
    { id:"dock_web", title:"Интернет", icon:"🌐", type:"url", url:"https://www.google.com/", iconImage:null },
    { id:"dock_camera", title:"Камера", icon:"📷", type:"url", url:"camera:", iconImage:null },
    { id:"dock_calc", title:"Калькулятор", icon:"🧮", type:"url", url:"calc:", iconImage:null }
  ],
  wallpapers: [],
  currentWallpaper: null
};

let state = loadState();
let selectedEmoji = "⭐";
let selectedCustomIcon = null;

/* =========================================================
   STORAGE
========================================================= */

function loadState(){
  try{
    const raw = localStorage.getItem("guestDesktopV3");
    if(!raw) return structuredClone(defaultState);
    const saved = JSON.parse(raw);

    // merge in case old save misses fields
    saved.pages = Array.isArray(saved.pages) && saved.pages.length ? saved.pages : structuredClone(defaultState.pages);
    saved.apps = Array.isArray(saved.apps) ? saved.apps : structuredClone(defaultState.apps);
    saved.dock = Array.isArray(saved.dock) ? saved.dock : structuredClone(defaultState.dock);
    saved.wallpapers = Array.isArray(saved.wallpapers) ? saved.wallpapers : [];
    saved.currentPage = Number.isInteger(saved.currentPage) ? saved.currentPage : 0;

    return saved;
  }catch(e){
    return structuredClone(defaultState);
  }
}

function saveState(){
  try{
    localStorage.setItem("guestDesktopV3", JSON.stringify(state));
    return true;
  }catch(e){
    alert("Не удалось сохранить данные. Возможно, память браузера заполнена.");
    return false;
  }
}

/* =========================================================
   TIME
========================================================= */

function updateClock(){
  const now = new Date();

  document.getElementById("heroTime").textContent =
    now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

  let d = now.toLocaleDateString("ru-RU",{
    weekday:"long",
    day:"numeric",
    month:"long"
  });

  d = d.charAt(0).toUpperCase() + d.slice(1);
  document.getElementById("heroDate").textContent = d;
}

updateClock();
setInterval(updateClock,10000);

/* =========================================================
   WALLPAPER
========================================================= */

function applyWallpaper(){
  const home = document.getElementById("home");

  if(state.currentWallpaper){
    home.style.backgroundImage = `url("${state.currentWallpaper}")`;
  }else{
    home.style.backgroundImage =
      "linear-gradient(160deg,#53657a,#263548 50%,#0b1119)";
  }
}

function compressImage(dataUrl,maxW,maxH,quality,callback){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width;
    let h = img.height;
    const ratio = Math.min(maxW/w,maxH/h,1);
    w = Math.max(1,Math.round(w*ratio));
    h = Math.max(1,Math.round(h*ratio));

    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;

    const ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    callback(c.toDataURL("image/jpeg",quality));
  };
  img.src = dataUrl;
}

document.getElementById("wallpaperInput").addEventListener("change",function(){
  const file = this.files && this.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e=>{
    compressImage(e.target.result,1179,2556,.8,compressed=>{
      const item = {
        id:"wall_"+Date.now(),
        image:compressed
      };

      state.wallpapers.push(item);
      state.currentWallpaper = compressed;

      if(saveState()){
        applyWallpaper();
        renderWallpaperSettings();
      }else{
        state.wallpapers.pop();
      }
    });
  };
  reader.readAsDataURL(file);
  this.value="";
});

function renderWallpaperSettings(){
  const box = document.getElementById("wallpaperGrid");
  box.innerHTML = "";

  if(!state.wallpapers.length){
    box.innerHTML = `<div class="muted" style="grid-column:1/-1;padding:12px 0">Обои пока не добавлены</div>`;
    return;
  }

  state.wallpapers.forEach(w=>{
    const el = document.createElement("div");
    el.className = "wallpaper" + (state.currentWallpaper===w.image ? " selected" : "");
    el.style.backgroundImage = `url("${w.image}")`;

    el.onclick = ()=>{
      state.currentWallpaper = w.image;
      saveState();
      applyWallpaper();
      renderWallpaperSettings();
    };

    const del = document.createElement("button");
    del.className = "mini-x";
    del.textContent = "×";
    del.onclick = ev=>{
      ev.stopPropagation();

      const wasCurrent = state.currentWallpaper===w.image;
      state.wallpapers = state.wallpapers.filter(x=>x.id!==w.id);

      if(wasCurrent){
        state.currentWallpaper = state.wallpapers[0]?.image || null;
      }

      saveState();
      applyWallpaper();
      renderWallpaperSettings();
    };

    el.appendChild(del);
    box.appendChild(el);
  });
}

========================================================= */

function iconHTML(app){
  if(app.iconImage){
    return `<div class="app-icon"><img src="${app.iconImage}" alt=""></div>`;
  }

  return `<div class="app-icon"><span class="emoji">${escapeHTML(app.icon || "⭐")}</span></div>`;
}

function createAppElement(app,dock=false){
  const el = document.createElement("div");
  el.className = "app";
  el.innerHTML = `
    ${iconHTML(app)}
    <div class="app-name">${escapeHTML(app.title || "")}</div>
  `;

  el.onclick = ()=>openApp(app);
  return el;
}

/* =========================================================
   RENDER DESKTOP
========================================================= */

function renderDesktop(){
  if(!state.pages.length){
    state.pages.push({id:"page_"+Date.now(),name:"Страница 1"});
  }

  state.currentPage = Math.max(0,Math.min(state.currentPage,state.pages.length-1));

  const track = document.getElementById("pagesTrack");
  const dots = document.getElementById("pageDots");
  const dock = document.getElementById("dock");

  track.innerHTML = "";
  dots.innerHTML = "";
  dock.innerHTML = "";

  state.pages.forEach((page,index)=>{
    const pageEl = document.createElement("section");
    pageEl.className = "page";

    const grid = document.createElement("div");
    grid.className = "app-grid";

    state.apps
      .filter(a=>a.enabled!==false && a.pageId===page.id)
      .forEach(app=>grid.appendChild(createAppElement(app)));

    pageEl.appendChild(grid);
    track.appendChild(pageEl);

    const dot = document.createElement("span");
    dot.className = "page-dot" + (index===state.currentPage ? " active" : "");
    dots.appendChild(dot);
  });

  state.dock.forEach(app=>{
    dock.appendChild(createAppElement(app,true));
  });

  updatePagePosition(false);
}

function updatePagePosition(animate=true){
  const track = document.getElementById("pagesTrack");
  track.style.transition = animate ? "transform .32s cubic-bezier(.22,.7,.18,1)" : "none";
  track.style.transform = `translateX(-${state.currentPage*100}%)`;

  [...document.querySelectorAll(".page-dot")]
    .forEach((d,i)=>d.classList.toggle("active",i===state.currentPage));

  setTimeout(()=>track.style.transition="transform .32s cubic-bezier(.22,.7,.18,1)",0);
}

/* =========================================================
   SWIPE
========================================================= */

const viewport = document.getElementById("pagesViewport");
let touchStartX = 0;
let touchStartY = 0;
let touching = false;

viewport.addEventListener("touchstart",e=>{
  if(!e.touches?.length) return;
  touching = true;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
},{passive:true});

viewport.addEventListener("touchend",e=>{
  if(!touching) return;
  touching = false;

  const t = e.changedTouches?.[0];
  if(!t) return;

  const dx = t.clientX-touchStartX;
  const dy = t.clientY-touchStartY;

  if(Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)) return;

  if(dx<0 && state.currentPage<state.pages.length-1){
    state.currentPage++;
  }else if(dx>0 && state.currentPage>0){
    state.currentPage--;
  }else{
    return;
  }

  saveState();
  updatePagePosition(true);
},{passive:true});

/* =========================================================
   OPEN APP
========================================================= */

function openApp(app){
  if(!app) return;

  switch(app.type){
    case "messages":
      openMessages();
      break;
    case "contacts":
      openContacts();
      break;
    case "social":
      openSocial();
      break;
    case "notes":
      openNotes();
      break;
    default:
      if(app.url && app.url !== "#"){
        window.location.href = app.url;
      }
  }
}

/* =========================================================
   PAGE SETTINGS
========================================================= */

function renderPageSettings(){
  const box = document.getElementById("pageSettings");
  box.innerHTML = "";

  state.pages.forEach((p,index)=>{
    const row = document.createElement("div");
    row.className = "page-row";
    row.innerHTML = `
      <div class="row-left">
        <div class="row-title">${escapeHTML(p.name)}</div>
        <div class="row-sub">${state.apps.filter(a=>a.pageId===p.id).length} прилож.</div>
      </div>
      <div class="row-actions">
        <button class="small-btn" ${index===0 ? "disabled" : ""}>←</button>
        <button class="small-btn" ${index===state.pages.length-1 ? "disabled" : ""}>→</button>
        <button class="small-btn red" ${state.pages.length===1 ? "disabled" : ""}>×</button>
      </div>
    `;

    const buttons = row.querySelectorAll("button");

    buttons[0].onclick = ()=>{
      if(index<=0) return;
      [state.pages[index-1],state.pages[index]] = [state.pages[index],state.pages[index-1]];
      state.currentPage = index-1;
      saveState();
      renderDesktop();
      renderSettings();
    };

    buttons[1].onclick = ()=>{
      if(index>=state.pages.length-1) return;
      [state.pages[index+1],state.pages[index]] = [state.pages[index],state.pages[index+1]];
      state.currentPage = index+1;
      saveState();
      renderDesktop();
      renderSettings();
    };

    buttons[2].onclick = ()=>{
      if(state.pages.length===1) return;

      const firstOther = state.pages.find(x=>x.id!==p.id);
      state.apps.forEach(a=>{
        if(a.pageId===p.id) a.pageId = firstOther.id;
      });

      state.pages = state.pages.filter(x=>x.id!==p.id);
      state.currentPage = Math.min(state.currentPage,state.pages.length-1);
      saveState();
      renderDesktop();
      renderSettings();
    };

    box.appendChild(row);
  });
}

        </div>
        ${app.removable!==false ? `<button class="small-btn red">×</button>` : ""}
      </div>

function addApp(){
  const title = document.getElementById("newAppTitle").value.trim();
  const type = document.getElementById("newAppType").value;
  const pageId = document.getElementById("newAppPage").value;
  const url = document.getElementById("newAppUrl").value.trim();

    alert("Введите название.");

  if(type==="url" && !url){
    alert("Введите ссылку или URL-схему.");
    return;
  }

  state.apps.push({
    id:"app_"+Date.now(),
    title,
    icon:selectedEmoji,
    iconImage:selectedCustomIcon,
    type,
    url:type==="url" ? url : "",
    pageId,
    enabled:true,
    removable:true
  });

  if(!saveState()) return;

  document.getElementById("newAppTitle").value = "";
  document.getElementById("newAppUrl").value = "";
  selectedEmoji = "⭐";
  selectedCustomIcon = null;
  document.getElementById("customIconPreview").classList.remove("show");

  renderDesktop();
  renderSettings();

  document.getElementById("appForm").classList.remove("show");

/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(text){
  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(text){
  return escapeHTML(text).replaceAll("`","&#096;");
}
