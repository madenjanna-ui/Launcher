<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">

<title>Home</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:#111;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}

.home{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:url("wallpapers/wall1.jpg") center/cover no-repeat;
    transition:.3s;
}

.home::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.04) 45%,rgba(0,0,0,.32));
    pointer-events:none;
}

.status{
    height:54px;
    padding:max(13px,env(safe-area-inset-top)) 22px 0;
    position:relative;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:15px;
    font-weight:650;
}

.status-right{
    display:flex;
    gap:7px;
}

#clock{
    user-select:none;
    -webkit-user-select:none;
}

.date-area{
    position:relative;
    z-index:2;
    padding:15px 24px 0;
}

.big-time{
    font-size:46px;
    font-weight:300;
    line-height:1;
    letter-spacing:-2px;
    text-shadow:0 2px 12px rgba(0,0,0,.35);
}

.date{
    margin-top:7px;
    font-size:15px;
    opacity:.86;
    text-shadow:0 2px 8px rgba(0,0,0,.45);
}

.apps{
    position:relative;
    z-index:2;
    padding:34px 20px 130px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px 15px;
}

.app{
    text-align:center;
    user-select:none;
    cursor:pointer;
}

.icon{
    width:min(17vw,70px);
    height:min(17vw,70px);
    margin:auto;
    border-radius:19px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(145deg,rgba(255,255,255,.36),rgba(255,255,255,.09));

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
    0 12px 28px rgba(0,0,0,.22),
    inset 0 1px 1px rgba(255,255,255,.65),
    inset 0 -1px 1px rgba(255,255,255,.10);

    backdrop-filter:blur(18px) saturate(170%);
    -webkit-backdrop-filter:blur(18px) saturate(170%);

    transition:.12s;
}

.icon::before{
    content:"";
    position:absolute;
    top:-35%;
    left:-15%;
    width:80%;
    height:70%;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    filter:blur(8px);
    transform:rotate(-15deg);
    pointer-events:none;
}

.app:active .icon{
    transform:scale(.89);
}

.name{
    margin-top:7px;
    font-size:12px;
    font-weight:500;
    text-shadow:0 2px 5px rgba(0,0,0,.75);
}

.dock{
    position:absolute;
    z-index:3;
    left:16px;
    right:16px;
    bottom:calc(10px + env(safe-area-inset-bottom));
    height:90px;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:space-around;

    background:
    linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 12px 35px rgba(0,0,0,.30),
    inset 0 1px rgba(255,255,255,.30);

    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
}

.dock .icon{
    width:62px;
    height:62px;
    border-radius:18px;
    font-size:29px;
}

.settings-overlay{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(7,8,12,.72);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    padding:
    calc(env(safe-area-inset-top) + 25px)
    18px
    calc(env(safe-area-inset-bottom) + 25px);

    overflow-y:auto;
}

.settings-overlay.show{
    display:block;
}

.settings-card{
    max-width:430px;
    margin:auto;
    padding:22px;
    border-radius:28px;
    background:rgba(35,35,42,.78);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 20px 50px rgba(0,0,0,.4);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.settings-title{
    font-size:23px;
    font-weight:700;
    margin-bottom:22px;
}

.section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.7px;
    opacity:.55;
    margin:22px 2px 10px;
}

.wallpapers{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.wallpaper{
    aspect-ratio:9/16;
    border-radius:16px;
    background-position:center;
    background-size:cover;
    border:2px solid transparent;
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

.wallpaper.selected{
    border-color:white;
}

.wallpaper.selected::after{
    content:"✓";
    position:absolute;
    right:7px;
    top:7px;
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
    color:#111;
    font-weight:700;
}

.setting-row{
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:16px;
}

.setting-left{
    min-width:0;
    flex:1;
}

.setting-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.setting-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.switch{
    width:49px;
    height:29px;
    border-radius:20px;
    background:rgba(255,255,255,.18);
    padding:3px;
    transition:.2s;
}

.switch-knob{
    width:23px;
    height:23px;
    border-radius:50%;
    background:white;
    transition:.2s;
}

.switch.on{
    background:#34c759;
}

.switch.on .switch-knob{
    transform:translateX(20px);
}

.delete-btn{
    border:0;
    width:34px;
    height:34px;
    border-radius:10px;
    color:white;
    background:rgba(255,59,48,.22);
    font-size:18px;
}

.settings-button{
    width:100%;
    height:52px;
    margin-top:14px;
    border:0;
    border-radius:16px;
    font-size:16px;
    font-weight:600;
    background:rgba(255,255,255,.94);
    color:#111;
}

.secondary{
    background:rgba(255,255,255,.10);
    color:white;
}

.add-form{
    display:none;
    margin-top:12px;
    padding:15px;
    border-radius:18px;
    background:rgba(255,255,255,.07);
}

.add-form.show{
    display:block;
}

.input{
    width:100%;
    height:48px;
    margin-top:10px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:16px;
    padding:0 14px;
    outline:none;
}

.input::placeholder{
    color:rgba(255,255,255,.45);
}

.icon-options{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:12px;
}

.icon-option{
    height:45px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:rgba(255,255,255,.08);
    border:1px solid transparent;
}

.icon-option.selected{
    border-color:white;
    background:rgba(255,255,255,.18);
}

.form-hint{
    margin-top:9px;
    font-size:12px;
    line-height:1.4;
    opacity:.55;
}

.empty{
    padding:15px 0;
    font-size:14px;
    opacity:.55;
}
</style>
</head>

<body>

<div class="home" id="home">

    <div class="status">
        <div id="clock">09:41</div>

        <div class="status-right">
            <span>●●●</span>
            <span>⌁</span>
            <span>100%</span>
        </div>
    </div>

    <div class="date-area">
        <div class="big-time" id="bigTime">09:41</div>
        <div class="date" id="date"></div>
    </div>

    <div class="apps" id="appsContainer"></div>

    <div class="dock">

        <div class="app" onclick="openURL('tel:')">
            <div class="icon">📞</div>
        </div>

        <div class="app" onclick="openURL('https://www.google.com/')">
            <div class="icon">🌐</div>
        </div>

        <div class="app" onclick="openURL('camera:')">
            <div class="icon">📷</div>
        </div>

        <div class="app" onclick="openURL('calc:')">
            <div class="icon">🧮</div>
        </div>

    </div>

</div>


<div class="settings-overlay" id="settingsOverlay">

    <div class="settings-card">

        <div class="settings-title">
            Настройки
        </div>

        <div class="section-title">
            Обои
        </div>

        <div class="wallpapers">

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall1.jpg"
            style="background-image:url('wallpapers/wall1.jpg')">
            </div>

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall2.jpg"
            style="background-image:url('wallpapers/wall2.jpg')">
            </div>

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall3.jpg"
            style="background-image:url('wallpapers/wall3.jpg')">
            </div>

        </div>


        <div class="section-title">
            Приложения
        </div>

        <div id="appSettings"></div>


        <button class="settings-button" onclick="toggleAddForm()">
            ＋ Добавить приложение
        </button>


        <div class="add-form" id="addForm">

            <input
            class="input"
            id="newTitle"
            placeholder="Название">

            <input
            class="input"
            id="newUrl"
            placeholder="Ссылка или URL-схема">

            <div class="section-title">
                Значок
            </div>

            <div class="icon-options" id="iconOptions"></div>

            <div class="form-hint">
                Примеры: https://..., tg://, tel:, maps://
            </div>

            <button class="settings-button" onclick="addApp()">
                Добавить
            </button>

        </div>


        <button class="settings-button secondary" onclick="closeSettings()">
            Готово
        </button>

    </div>

</div>


<script>

const defaultApps = [
{
    id:"music",
    title:"Музыка",
    icon:"🎵",
    url:"https://madenjanna-ui.github.io/Music-edition/",
    enabled:true,
    removable:false
},
{
    id:"planner",
    title:"Планер",
    icon:"📅",
    url:"#",
    enabled:true,
    removable:false
},
{
    id:"family",
    title:"Сообщения",
    icon:"💬",
    url:"#",
    enabled:true,
    removable:false
},
{
    id:"games",
    title:"Игры",
    icon:"🎮",
    url:"https://madenjanna-ui.github.io/Avtoslalom/",
    enabled:true,
    removable:false
},
{
    id:"journal",
    title:"Журнал",
    icon:"📊",
    url:"#",
    enabled:true,
    removable:false
},
{
    id:"notes",
    title:"Заметки",
    icon:"📝",
    url:"#",
    enabled:true,
    removable:false
},
{
    id:"photos",
    title:"Фото",
    icon:"🖼️",
    url:"#",
    enabled:true,
    removable:false
},
{
    id:"maps",
    title:"Карты",
    icon:"🗺️",
    url:"https://maps.apple.com/",
    enabled:true,
    removable:false
}
];


const iconChoices = [
"🎵","📅","💬","🎮","📝","📊",
"📷","🖼️","🌐","🗺️","📞","🧮",
"📁","🎬","📺","☁️","📚","💳",
"🚗","✉️","⌚","🏠","🔎","⭐"
];


let selectedIcon = "⭐";


let apps = JSON.parse(
    localStorage.getItem("launcherFullApps") || "null"
);

if(!apps){
    apps = defaultApps;
    saveFullApps();
}


const savedWallpaper =
localStorage.getItem("launcherWallpaper")
||
"wallpapers/wall1.jpg";


document.getElementById("home").style.backgroundImage =
`url("${savedWallpaper}")`;


function saveFullApps(){
    localStorage.setItem(
        "launcherFullApps",
        JSON.stringify(apps)
    );
}


function renderApps(){

    const container =
    document.getElementById("appsContainer");

    container.innerHTML = "";

    apps
    .filter(app=>app.enabled)
    .forEach(app=>{

        const el = document.createElement("div");

        el.className = "app";

        el.innerHTML = `
            <div class="icon">${app.icon}</div>
            <div class="name">${escapeHTML(app.title)}</div>
        `;

        el.onclick = ()=>openURL(app.url);

        container.appendChild(el);
    });
}


function renderSettings(){

    const box =
    document.getElementById("appSettings");

    box.innerHTML = "";

    if(!apps.length){
        box.innerHTML =
        `<div class="empty">Нет приложений</div>`;
        return;
    }

    apps.forEach(app=>{

        const row = document.createElement("div");

        row.className = "setting-row";

        row.innerHTML = `
            <div class="setting-left">
                <div class="setting-name">
                    ${app.icon} ${escapeHTML(app.title)}
                </div>
            </div>

            <div class="setting-actions">

                <div class="switch ${app.enabled ? "on" : ""}">
                    <div class="switch-knob"></div>
                </div>

                ${
                    app.removable
                    ?
                    `<button class="delete-btn">×</button>`
                    :
                    ""
                }

            </div>
        `;

        const switchEl =
        row.querySelector(".switch");

        switchEl.onclick = e=>{
            e.stopPropagation();

            app.enabled = !app.enabled;

            saveFullApps();
            renderApps();
            renderSettings();
        };


        const deleteBtn =
        row.querySelector(".delete-btn");

        if(deleteBtn){

            deleteBtn.onclick = e=>{

                e.stopPropagation();

                if(confirm(
                    `Удалить «${app.title}»?`
                )){
                    apps = apps.filter(
                        item=>item.id !== app.id
                    );

                    saveFullApps();
                    renderApps();
                    renderSettings();
                }
            };
        }

        box.appendChild(row);
    });
}


function renderIconOptions(){

    const box =
    document.getElementById("iconOptions");

    box.innerHTML = "";

    iconChoices.forEach(icon=>{

        const item =
        document.createElement("div");

        item.className =
        "icon-option"
        +
        (
            icon === selectedIcon
            ?
            " selected"
            :
            ""
        );

        item.textContent = icon;

        item.onclick = ()=>{

            selectedIcon = icon;

            renderIconOptions();
        };

        box.appendChild(item);
    });
}


function toggleAddForm(){

    document
    .getElementById("addForm")
    .classList.toggle("show");
}


function addApp(){

    const title =
    document
    .getElementById("newTitle")
    .value
    .trim();

    const url =
    document
    .getElementById("newUrl")
    .value
    .trim();


    if(!title){

        alert("Введите название приложения.");

        return;
    }


    if(!url){

        alert("Введите ссылку или URL-схему.");

        return;
    }


    apps.push({

        id:
        "custom_"
        +
        Date.now(),

        title:title,

        icon:selectedIcon,

        url:url,

        enabled:true,

        removable:true

    });


    saveFullApps();

    renderApps();

    renderSettings();


    document
    .getElementById("newTitle")
    .value = "";


    document
    .getElementById("newUrl")
    .value = "";


    selectedIcon = "⭐";

    renderIconOptions();

    document
    .getElementById("addForm")
    .classList.remove("show");
}


function openURL(url){

    if(
        !url
        ||
        url === "#"
    ){
        return;
    }

    window.location.href = url;
}


document
.querySelectorAll(".wallpaper")
.forEach(item=>{

    item.onclick = ()=>{

        const wallpaper =
        item.dataset.wallpaper;

        document
        .getElementById("home")
        .style.backgroundImage =
        `url("${wallpaper}")`;

        localStorage.setItem(
            "launcherWallpaper",
            wallpaper
        );

        updateWallpaperSelection();
    };
});


function updateWallpaperSelection(){

    const current =
    localStorage.getItem(
        "launcherWallpaper"
    )
    ||
    "wallpapers/wall1.jpg";

    document
    .querySelectorAll(".wallpaper")
    .forEach(item=>{

        item.classList.toggle(
            "selected",
            item.dataset.wallpaper === current
        );
    });
}


function updateClock(){

    const now = new Date();

    const time =
    now.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    document
    .getElementById("clock")
    .textContent = time;

    document
    .getElementById("bigTime")
    .textContent = time;


    let date =
    now.toLocaleDateString(
        "ru-RU",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );

    date =
    date.charAt(0).toUpperCase()
    +
    date.slice(1);

    document
    .getElementById("date")
    .textContent = date;
}


updateClock();

setInterval(
    updateClock,
    10000
);


const clock =
document.getElementById("clock");

let pressTimer;


clock.addEventListener(
    "touchstart",
    ()=>{

        pressTimer =
        setTimeout(
            openSettings,
            1700
        );
    }
);


clock.addEventListener(
    "touchend",
    ()=>{
        clearTimeout(pressTimer);
    }
);


clock.addEventListener(
    "touchmove",
    ()=>{
        clearTimeout(pressTimer);
    }
);


function openSettings(){

    renderSettings();

    renderIconOptions();

    updateWallpaperSelection();

    document
    .getElementById("settingsOverlay")
    .classList.add("show");
}


function closeSettings(){

    document
    .getElementById("settingsOverlay")
    .classList.remove("show");
}


function escapeHTML(text){

    return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


renderApps();
renderIconOptions();
updateWallpaperSelection();

</script>

</body>
</html>
