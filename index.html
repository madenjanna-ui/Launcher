<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">

<title>Home</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:#111;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}

.home{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;

    background-image:url("wallpapers/wall1.jpg");
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    transition:background-image .3s ease;
}

.home::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(0,0,0,.08),
        rgba(0,0,0,.04) 45%,
        rgba(0,0,0,.30)
    );

    pointer-events:none;
}

/* =========================
   STATUS
========================= */

.status{
    height:54px;

    padding:
    max(13px,env(safe-area-inset-top))
    22px
    0;

    position:relative;
    z-index:5;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    font-size:15px;
    font-weight:650;
}

.status-right{
    display:flex;
    gap:7px;
    align-items:center;
}

#clock{
    user-select:none;
    -webkit-user-select:none;
}

/* =========================
   DATE
========================= */

.date-area{
    position:relative;
    z-index:2;

    padding:
    15px
    24px
    0;
}

.big-time{
    font-size:46px;
    font-weight:300;
    line-height:1;
    letter-spacing:-2px;

    text-shadow:
    0 2px 12px rgba(0,0,0,.35);
}

.date{
    margin-top:7px;
    font-size:15px;
    opacity:.86;

    text-shadow:
    0 2px 8px rgba(0,0,0,.45);
}

/* =========================
   APPS
========================= */

.apps{
    position:relative;
    z-index:2;

    padding:
    34px
    20px
    130px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    column-gap:15px;
    row-gap:24px;
}

.app{
    text-align:center;
    user-select:none;
    cursor:pointer;
}

.icon{
    width:min(17vw,70px);
    height:min(17vw,70px);

    margin:auto;

    border-radius:19px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:32px;

    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.34),
        rgba(255,255,255,.10)
    );

    border:
    1px solid rgba(255,255,255,.32);

    box-shadow:
    0 12px 28px rgba(0,0,0,.22),
    inset 0 1px 1px rgba(255,255,255,.65),
    inset 0 -1px 1px rgba(255,255,255,.10);

    backdrop-filter:
    blur(18px)
    saturate(160%);

    -webkit-backdrop-filter:
    blur(18px)
    saturate(160%);

    transition:
    transform .12s ease,
    filter .12s ease;
}

.icon::before{
    content:"";

    position:absolute;

    top:-35%;
    left:-15%;

    width:80%;
    height:70%;

    border-radius:50%;

    background:
    rgba(255,255,255,.23);

    filter:blur(8px);

    transform:rotate(-15deg);

    pointer-events:none;
}

.app:active .icon{
    transform:scale(.89);
    filter:brightness(.88);
}

.name{
    margin-top:7px;

    font-size:12px;
    font-weight:500;

    text-shadow:
    0 2px 5px rgba(0,0,0,.75);
}

/* =========================
   DOCK
========================= */

.dock{
    position:absolute;

    z-index:3;

    left:16px;
    right:16px;

    bottom:
    calc(10px + env(safe-area-inset-bottom));

    height:90px;

    border-radius:30px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.22),
        rgba(255,255,255,.08)
    );

    border:
    1px solid rgba(255,255,255,.25);

    box-shadow:
    0 12px 35px rgba(0,0,0,.30),
    inset 0 1px rgba(255,255,255,.30);

    backdrop-filter:
    blur(28px)
    saturate(170%);

    -webkit-backdrop-filter:
    blur(28px)
    saturate(170%);
}

.dock .icon{
    width:62px;
    height:62px;

    border-radius:18px;

    font-size:29px;
}

/* =========================
   SETTINGS OVERLAY
========================= */

.settings-overlay{
    display:none;

    position:absolute;
    inset:0;

    z-index:100;

    background:
    rgba(7,8,12,.72);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    padding:
    calc(env(safe-area-inset-top) + 30px)
    18px
    calc(env(safe-area-inset-bottom) + 22px);

    overflow-y:auto;
}

.settings-overlay.show{
    display:block;
}

.settings-card{
    max-width:430px;
    margin:auto;

    padding:22px;

    border-radius:28px;

    background:
    rgba(35,35,42,.72);

    border:
    1px solid rgba(255,255,255,.16);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.settings-title{
    font-size:23px;
    font-weight:700;

    margin-bottom:22px;
}

.section-title{
    font-size:13px;

    text-transform:uppercase;

    letter-spacing:.7px;

    opacity:.55;

    margin:
    22px
    2px
    10px;
}

/* =========================
   WALLPAPERS
========================= */

.wallpapers{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;
}

.wallpaper{
    aspect-ratio:9/16;

    border-radius:16px;

    background-position:center;
    background-size:cover;

    border:
    2px solid transparent;

    position:relative;
    overflow:hidden;

    cursor:pointer;
}

.wallpaper.selected{
    border-color:white;
}

.wallpaper.selected::after{
    content:"✓";

    position:absolute;

    right:7px;
    top:7px;

    width:24px;
    height:24px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;
    color:#111;

    font-weight:700;
}

/* =========================
   SETTINGS ROWS
========================= */

.setting-row{
    min-height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
    1px solid rgba(255,255,255,.08);

    font-size:16px;
}

.switch{
    width:49px;
    height:29px;

    border-radius:20px;

    background:
    rgba(255,255,255,.18);

    padding:3px;

    transition:.2s;
}

.switch-knob{
    width:23px;
    height:23px;

    border-radius:50%;

    background:white;

    transition:.2s;
}

.switch.on{
    background:#34c759;
}

.switch.on .switch-knob{
    transform:translateX(20px);
}

/* =========================
   BUTTONS
========================= */

.settings-button{
    width:100%;
    height:52px;

    margin-top:20px;

    border:0;

    border-radius:16px;

    font-size:16px;
    font-weight:600;

    background:
    rgba(255,255,255,.94);

    color:#111;
}

.secondary{
    background:
    rgba(255,255,255,.10);

    color:white;
}

</style>
</head>

<body>

<div
class="home"
id="home">

    <!-- STATUS -->

    <div class="status">

        <div id="clock">
            09:41
        </div>

        <div class="status-right">
            <span>●●●</span>
            <span>⌁</span>
            <span>100%</span>
        </div>

    </div>


    <!-- DATE -->

    <div class="date-area">

        <div
        class="big-time"
        id="bigTime">
            09:41
        </div>

        <div
        class="date"
        id="date">
        </div>

    </div>


    <!-- APPS -->

    <div
    class="apps"
    id="appsContainer">
    </div>


    <!-- DOCK -->

    <div class="dock">

        <div
        class="app"
        onclick="openApp('phone')">

            <div class="icon">
                📞
            </div>

        </div>


        <div
        class="app"
        onclick="openApp('browser')">

            <div class="icon">
                🌐
            </div>

        </div>


        <div
        class="app"
        onclick="openApp('camera')">

            <div class="icon">
                📷
            </div>

        </div>


        <div
        class="app"
        onclick="openApp('calculator')">

            <div class="icon">
                🧮
            </div>

        </div>

    </div>

</div>


<!-- SETTINGS -->

<div
class="settings-overlay"
id="settingsOverlay">

    <div class="settings-card">

        <div class="settings-title">
            Настройки
        </div>


        <div class="section-title">
            Обои
        </div>


        <div class="wallpapers">

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall1.jpg"
            style="
            background-image:
            url('wallpapers/wall1.jpg')
            ">
            </div>

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall2.jpg"
            style="
            background-image:
            url('wallpapers/wall2.jpg')
            ">
            </div>

            <div
            class="wallpaper"
            data-wallpaper="wallpapers/wall3.jpg"
            style="
            background-image:
            url('wallpapers/wall3.jpg')
            ">
            </div>

        </div>


        <div class="section-title">
            Приложения
        </div>


        <div id="appSettings">
        </div>


        <button
        class="settings-button secondary"
        onclick="closeSettings()">

            Готово

        </button>

    </div>

</div>


<script>

/* =========================
   APPLICATIONS
========================= */

const apps = [

{
    id:"music",
    title:"Музыка",
    icon:"🎵",

    url:
    "https://madenjanna-ui.github.io/Music-edition/",

    enabled:true
},

{
    id:"planner",
    title:"Планер",
    icon:"📅",

    url:"#",

    enabled:true
},

{
    id:"family",
    title:"Сообщения",
    icon:"💬",

    url:"#",

    enabled:true
},

{
    id:"games",
    title:"Игры",
    icon:"🎮",

    url:
    "https://madenjanna-ui.github.io/Avtoslalom/",

    enabled:true
},

{
    id:"journal",
    title:"Журнал",
    icon:"📊",

    url:"#",

    enabled:true
},

{
    id:"notes",
    title:"Заметки",
    icon:"📝",

    url:"#",

    enabled:true
},

{
    id:"photos",
    title:"Фото",
    icon:"🖼️",

    url:"#",

    enabled:true
},

{
    id:"maps",
    title:"Карты",
    icon:"🗺️",

    url:
    "https://maps.apple.com/",

    enabled:true
}

];


/* =========================
   SYSTEM LINKS
========================= */

const systemApps = {

    phone:"tel:",

    browser:
    "https://www.google.com/",

    camera:"camera:",

    calculator:"calc:"

};


/* =========================
   LOAD SETTINGS
========================= */

const savedApps =
JSON.parse(
    localStorage.getItem(
        "launcherApps"
    ) || "{}"
);


apps.forEach(app=>{

    if(
        savedApps[app.id]
        !== undefined
    ){

        app.enabled =
        savedApps[app.id];

    }

});


const savedWallpaper =
localStorage.getItem(
    "launcherWallpaper"
)
||
"wallpapers/wall1.jpg";


document
.getElementById("home")
.style.backgroundImage =
`url("${savedWallpaper}")`;


/* =========================
   RENDER APPS
========================= */

function renderApps(){

    const container =
    document.getElementById(
        "appsContainer"
    );


    container.innerHTML="";


    apps
    .filter(app=>app.enabled)
    .forEach(app=>{

        const el =
        document.createElement(
            "div"
        );


        el.className="app";


        el.innerHTML=`

            <div class="icon">
                ${app.icon}
            </div>

            <div class="name">
                ${app.title}
            </div>

        `;


        el.onclick=()=>{

            openURL(
                app.url
            );

        };


        container.appendChild(el);

    });

}


/* =========================
   APP SETTINGS
========================= */

function renderSettings(){

    const box =
    document.getElementById(
        "appSettings"
    );


    box.innerHTML="";


    apps.forEach(app=>{

        const row =
        document.createElement(
            "div"
        );


        row.className=
        "setting-row";


        row.innerHTML=`

            <span>
                ${app.icon}
                ${app.title}
            </span>

            <div
            class="switch
            ${app.enabled ? "on" : ""}"
            >

                <div
                class="switch-knob">
                </div>

            </div>

        `;


        row.onclick=()=>{

            app.enabled=
            !app.enabled;


            saveApps();

            renderApps();

            renderSettings();

        };


        box.appendChild(row);

    });

}


/* =========================
   SAVE
========================= */

function saveApps(){

    const state={};


    apps.forEach(app=>{

        state[app.id]=
        app.enabled;

    });


    localStorage.setItem(
        "launcherApps",
        JSON.stringify(state)
    );

}


/* =========================
   OPEN APP
========================= */

function openApp(id){

    openURL(
        systemApps[id]
    );

}


function openURL(url){

    if(
        !url
        ||
        url==="#"
    ){

        return;

    }


    window.location.href=url;

}


/* =========================
   WALLPAPER
========================= */

document
.querySelectorAll(
    ".wallpaper"
)
.forEach(item=>{

    item.onclick=()=>{

        const wallpaper =
        item.dataset.wallpaper;


        document
        .getElementById("home")
        .style.backgroundImage =
        `url("${wallpaper}")`;


        localStorage.setItem(
            "launcherWallpaper",
            wallpaper
        );


        updateWallpaperSelection();

    };

});


function updateWallpaperSelection(){

    const current =
    localStorage.getItem(
        "launcherWallpaper"
    )
    ||
    "wallpapers/wall1.jpg";


    document
    .querySelectorAll(
        ".wallpaper"
    )
    .forEach(item=>{

        item.classList.toggle(
            "selected",
            item.dataset.wallpaper
            === current
        );

    });

}


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now =
    new Date();


    const time =
    now.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );


    document
    .getElementById("clock")
    .textContent=time;


    document
    .getElementById("bigTime")
    .textContent=time;


    let date =
    now.toLocaleDateString(
        "ru-RU",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );


    date =
    date.charAt(0).toUpperCase()
    +date.slice(1);


    document
    .getElementById("date")
    .textContent=date;

}


updateClock();

setInterval(
    updateClock,
    10000
);


/* =========================
   HIDDEN SETTINGS
========================= */

const clock =
document.getElementById(
    "clock"
);


let pressTimer;


clock.addEventListener(
    "touchstart",
    ()=>{

        pressTimer=
        setTimeout(
            openSettings,
            1700
        );

    }
);


clock.addEventListener(
    "touchend",
    ()=>{

        clearTimeout(
            pressTimer
        );

    }
);


clock.addEventListener(
    "touchmove",
    ()=>{

        clearTimeout(
            pressTimer
        );

    }
);


function openSettings(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(30);

    }


    renderSettings();

    updateWallpaperSelection();


    document
    .getElementById(
        "settingsOverlay"
    )
    .classList.add(
        "show"
    );

}


function closeSettings(){

    document
    .getElementById(
        "settingsOverlay"
    )
    .classList.remove(
        "show"
    );

}


/* =========================
   START
========================= */

renderApps();

updateWallpaperSelection();

</script>

</body>
</html>
