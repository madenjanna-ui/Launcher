/* ================================
   HOME
================================ */

================================ */

/* =========================================================
   CLEAN OLD HEAVY STORAGE
========================================================= */

function cleanupOldStorage(){

  const cleanupFlag =
  "v41_cleanup_done";

  if(
    localStorage.getItem(cleanupFlag)
  ){
    return;
  }

  const oldKeys = [

    "guestDesktopV3",
    "iosGuestV4",

    "launcherWallpapers",
    "launcherCurrentWallpaper",

    "launcherWallpaper",
    "launcherFullApps"

  ];

  oldKeys.forEach(
    key=>{

      try{
        localStorage.removeItem(key);
      }catch(e){}

    }
  );

  try{
    localStorage.setItem(
      cleanupFlag,
      "1"
    );
  }catch(e){}

}

cleanupOldStorage();


/* =========================================================
   INDEXED DB
========================================================= */

const DB_NAME =
"GuestDesktopAssets";

const DB_VERSION =
1;

const STORE =
"assets";


function openDB(){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


      request.onupgradeneeded =
      event=>{

        const db =
        event.target.result;

        if(
          !db.objectStoreNames
          .contains(STORE)
        ){

          db.createObjectStore(
            STORE,
            {
              keyPath:"id"
            }
          );

        }

      };


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );

}


async function saveAsset(
  id,
  blob
){

  const db =
  await openDB();


  return new Promise(
    (
      resolve,
      reject
    )=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );


      tx.objectStore(STORE)
      .put({
        id:id,
        blob:blob
      });


      tx.oncomplete =
      ()=>resolve();


      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );

}


async function getAsset(id){

  if(!id){
    return null;
  }


  const db =
  await openDB();


  return new Promise(
    (
      resolve,
      reject
    )=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );


      const request =
      tx.objectStore(STORE)
      .get(id);


      request.onsuccess =
      ()=>resolve(
        request.result
        ?.
        blob
        ||
        null
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );

}


async function deleteAsset(id){

  if(!id){
    return;
  }


  const db =
  await openDB();


  return new Promise(
    resolve=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );


      tx.objectStore(STORE)
      .delete(id);


      tx.oncomplete =
      ()=>resolve();

    }
  );

}


/* =========================================================
   OBJECT URL CACHE
========================================================= */

const assetUrls =
new Map();


async function assetUrl(id){

  if(!id){
    return null;
  }


  if(
    assetUrls.has(id)
  ){

    return assetUrls.get(id);

  }


  const blob =
  await getAsset(id);


  if(!blob){
    return null;
  }


  const url =
  URL.createObjectURL(blob);


  assetUrls.set(
    id,
    url
  );


  return url;

}

function cloneDefault(){

  return JSON.parse(
    JSON.stringify(
      DEFAULT_STATE
    )
  );

}


function loadState(){

  try{

    const raw =
    localStorage.getItem(
      "iosGuestV41"
    );


    if(!raw){
      return cloneDefault();
    }


    return Object.assign(
      cloneDefault(),
      JSON.parse(raw)
    );

  }catch(e){

    return cloneDefault();

  }

}


let state =
loadState();

  try{

    localStorage.setItem(
      "iosGuestV41",

/* =========================================================

========================================================= */

async function applyWallpaper(){

  const home =
  document.getElementById(
    "home"
  );


  if(
    !state.currentWallpaperId
  ){

    home.style.backgroundImage =
    "linear-gradient(160deg,#495a70,#263448 52%,#0d121a)";

    return;
  }


  const url =
  await assetUrl(
    state.currentWallpaperId
  );


  if(url){

    home.style.backgroundImage =
    `url("${url}")`;

  }

}


/* =========================================================
   IMAGE COMPRESS TO BLOB
========================================================= */

function compressFile(
  file,
  maxWidth,
  maxHeight,
  quality=.82
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const reader =
      new FileReader();


      reader.onload =
      ()=>{

        const image =
        new Image();


        image.onload =
        ()=>{

          let w =
          image.width;

          let h =
          image.height;


          const ratio =
          Math.min(
            maxWidth/w,
            maxHeight/h,
            1
          );


          w =
          Math.round(w*ratio);

          h =
          Math.round(h*ratio);


          const canvas =
          document.createElement(
            "canvas"
          );


          canvas.width =
          w;

          canvas.height =
          h;


          canvas
          .getContext("2d")
          .drawImage(
            image,
            0,
            0,
            w,
            h
          );


          canvas.toBlob(
            blob=>{

              if(blob){
                resolve(blob);
              }else{
                reject();
              }

            },
            "image/jpeg",
            quality
          );

        };


        image.onerror =
        reject;


        image.src =
        reader.result;

      };


      reader.onerror =
      reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

function iconHTML(app){

  return `

      <span class="emoji">
        ${safe(app.icon || "⭐")}

async function hydrateImages(){

  const nodes =
  document
  .querySelectorAll(
    "[data-image-id]"
  );


  for(
    const node of nodes
  ){

    const id =
    node.dataset.imageId;


    if(!id){
      continue;
    }


    const url =
    await assetUrl(id);


    if(
      url
      &&
      !node.querySelector("img")
    ){

      const img =
      document.createElement(
        "img"
      );


      img.src =
      url;


      node.appendChild(img);

    }

  }

}


/* =========================================================
   APP ELEMENT
========================================================= */

function createAppElement(app){

  const element =
  document.createElement(
    "div"
  );


  element.className =
  "app";


  element.innerHTML = `

    ${
      app.removable !== false
      ?
      `
      <button
      class="delete-app">
        −
      </button>
      `
      :
      ""
    }

    ${iconHTML(app)}

    <div class="app-name">
      ${safe(app.title)}
    </div>

  `;


  const del =
  element.querySelector(
    ".delete-app"
  );


  if(del){

    del.onclick =
    async event=>{

      event.stopPropagation();


      if(app.imageId){
        await deleteAsset(
          app.imageId
        );
      }


      state.apps =
      state.apps.filter(
        item=>
        item.id !== app.id
      );


      saveState();

      render();

    };

  }


  element.onclick =
  ()=>{

    if(state.editing){
      return;
    }

    openApp(app);

  };


  return element;

}


/* =========================================================
   RENDER DESKTOP
========================================================= */

function render(){

  const track =
  document.getElementById(
    "track"
  );

  const dots =
  document.getElementById(
    "dots"
  );

  const dock =
  document.getElementById(
    "dock"
  );


  track.innerHTML =
  "";

  dots.innerHTML =
  "";

  dock.innerHTML =
  "";


  state.currentPage =
  Math.max(
    0,
    Math.min(
      state.currentPage,
      state.pages.length-1
    )
  );


  state.pages
  .forEach(
    (
      page,
      index
    )=>{

      const pageElement =
      document.createElement(
        "section"
      );


      pageElement.className =
      "page";


      const grid =
      document.createElement(
        "div"
      );


      grid.className =
      "grid";


      state.apps
      .filter(
        app=>
        app.pageId === page.id
      )
      .forEach(
        app=>{

          grid.appendChild(
            createAppElement(app)
          );

        }
      );


      pageElement.appendChild(
        grid
      );


      track.appendChild(
        pageElement
      );


      const dot =
      document.createElement(
        "div"
      );


      dot.className =
      "dot"
      +
      (
        index === state.currentPage
        ?
        " active"
        :
        ""
      );


      dots.appendChild(dot);

    }
  );


  state.dock
  .forEach(
    app=>{

      dock.appendChild(
        createAppElement(app)
      );

    }
  );


  document
  .getElementById(
    "home"
  )
  .classList.toggle(
    "editing",
    state.editing
  );


  updatePage(false);

  hydrateImages();

}


/* =========================================================
   PAGE POSITION
========================================================= */

function updatePage(
  animate=true
){

  const track =
  document.getElementById(
    "track"
  );


  track.style.transition =
  animate
  ?
  "transform .32s cubic-bezier(.22,.7,.18,1)"
  :
  "none";


  track.style.transform =
  `translateX(-${state.currentPage*100}%)`;


  document
  .querySelectorAll(
    ".dot"
  )
  .forEach(
    (
      dot,
      index
    )=>{

      dot.classList.toggle(
        "active",
        index === state.currentPage
      );

    }
  );

}


/* =========================================================
   SWIPE
========================================================= */

const viewport =
document.getElementById(
  "pagesViewport"
);


let touchX =
0;

let touchY =
0;


viewport.addEventListener(
  "touchstart",
  event=>{

    touchX =
    event.touches[0]
    .clientX;

    touchY =
    event.touches[0]
    .clientY;

  },
  {
    passive:true
  }
);


viewport.addEventListener(
  "touchend",
  event=>{

    const touch =
    event.changedTouches[0];


    const dx =
    touch.clientX-touchX;


    const dy =
    touch.clientY-touchY;


    if(
      dy > 90
      &&
      Math.abs(dy)
      >
      Math.abs(dx)
    ){

      openSearch();

      return;
    }


    if(
      Math.abs(dx)<45
      ||
      Math.abs(dx)
      <
      Math.abs(dy)
    ){

      return;
    }


    if(
      dx < 0
      &&
      state.currentPage
      <
      state.pages.length-1
    ){

      state.currentPage++;

    }


    else if(
      dx > 0
      &&
      state.currentPage > 0
    ){

      state.currentPage--;

    }


    saveState();

    updatePage(true);

  },
  {
    passive:true
  }
);

function openApp(app){

  switch(app.type){

    case "settings":
      openSettings();
      break;

    case "messages":
      openMessages();
      break;

    case "contacts":
      openContacts();
      break;

    case "photos":
      openPhotos();
      break;

    case "notes":
      openNotes();
      break;

    case "calculator":
      openCalculator();
      break;

    case "catalog":
      openCatalog();
      break;

    case "url":

      if(
        /^https?:\/\//i
        .test(app.url)
      ){

        openBrowser(
          app.url,
          app.title
        );

      }else{

        window.location.href =
        app.url;

      }

      break;

  }

}

async function openWallpaperSettings(){

  let html =
  `<div class="wallpaper-grid">`;


  for(
    const wallpaper
    of state.wallpapers
  ){

    const url =
    await assetUrl(
      wallpaper.id
    );


    if(!url){
      continue;
    }


    html += `

      <div

      class="
      wallpaper
      ${
        state.currentWallpaperId
        ===
        wallpaper.id
        ?
        "selected"
        :
        ""
      }
      "

      style="
      background-image:
      url('${url}')
      "

      onclick="
      selectWallpaper('${wallpaper.id}')
      ">

        <button
        class="wallpaper-delete"
        onclick="
        event.stopPropagation();
        removeWallpaper('${wallpaper.id}')
        ">
          ×
        </button>

      </div>

    `;

  }


  html +=
  `</div>`;


  html += `

    <button
    class="primary"
    onclick="
    document
    .getElementById('wallpaperInput')
    .click()
    ">
      Добавить фото
    </button>

  `;


  showSystem(
    "Обои",
    html,
    "openSettings()"
  );

}


document
.getElementById(
  "wallpaperInput"
)
.addEventListener(
  "change",
  async function(){

    const file =
    this.files[0];


    if(!file){
      return;
    }


    try{

      const blob =
      await compressFile(
        file,
        1179,
        2556,
        .8
      );


      const id =
      "wall_"
      +
      Date.now();


      await saveAsset(
        id,
        blob
      );


      state.wallpapers
      .push({
        id:id
      });


      state.currentWallpaperId =
      id;


      saveState();

      await applyWallpaper();

      await openWallpaperSettings();

    }

    catch(error){

      alert(
        "Не удалось добавить изображение."
      );

    }


    this.value =
    "";

  }
);


async function selectWallpaper(id){

  state.currentWallpaperId =
  id;

  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}


async function removeWallpaper(id){

  await deleteAsset(id);


  if(
    assetUrls.has(id)
  ){

    URL.revokeObjectURL(
      assetUrls.get(id)
    );

    assetUrls.delete(id);

  }


  state.wallpapers =
  state.wallpapers.filter(
    item=>
    item.id !== id
  );


  if(
    state.currentWallpaperId
    ===
    id
  ){

    state.currentWallpaperId =
    state.wallpapers[0]
    ?.id
    ||
    null;

  }


  saveState();

  await applyWallpaper();

  await openWallpaperSettings();

}

function openPageSettings(){

  let html =
  `<div class="settings-group">`;


  state.pages

      index
    )=>{

      const count =
      state.apps.filter(
        app=>
        app.pageId === page.id
      ).length;


      html += `

        <div class="settings-row">

          <div class="settings-main">

            ${safe(page.name)}

            <div class="settings-small">
              ${count} прилож.
            </div>

          </div>

          ${
            state.pages.length > 1
            ?
            `
            <button
            style="
            border:0;
            background:none;
            color:#ff3b30;
            "
            onclick="
            removePage('${page.id}')
            ">
              Удалить
            </button>
            `
            :
            ""
          }

        </div>

      `;

    }
  );


  html +=
  `</div>`;


  html += `

    <button
    class="primary"
    onclick="addPage()">
      Добавить страницу
    </button>

  `;


  showSystem(
    "Рабочие столы",
    html,
    "openSettings()"
  );

}


function addPage(){

  state.pages.push({

    id:
    "page_"
    +
    Date.now(),

    name:
    "Страница "
    +
    (
      state.pages.length
      +
      1
    )

  });


  state.currentPage =
  state.pages.length-1;


  saveState();

  render();

  openPageSettings();

}


function removePage(id){

  if(
    state.pages.length <= 1
  ){
    return;
  }


  const target =
  state.pages.find(
    item=>
    item.id !== id
  );


  state.apps.forEach(
    app=>{

      if(
        app.pageId === id
      ){

        app.pageId =
        target.id;

      }

    }
  );


  state.pages =
  state.pages.filter(
    item=>
    item.id !== id
  );


  state.currentPage =
  0;


  saveState();

  render();

  openPageSettings();

}

                        80
                      )
                    )
                  }

                </div>

              </div>

            `
          ).join("")
          :
          `
          <div
          style="
          color:#888;
          text-align:center;
          padding:30px;
          ">
            Нет заметок
          </div>
          `
        }

      </div>

    `

  );

}


function editNote(index){

  const notes =
  JSON.parse(
    localStorage.getItem(
      "v41Notes"
    )
    ||
    "[]"
  );


  const note =
  index >= 0
  ?
  notes[index]
  :
  {
    title:"",
    text:""
  };


  showSystem(

    "Заметка",

    `

      <input
      class="field"
      id="noteTitle"
      placeholder="Название"
      value="${attr(note.title)}">


      <textarea
      class="field"
      id="noteText"
      style="height:140px;padding-top:12px"
      placeholder="Текст">${safe(note.text)}</textarea>


      <button
      class="primary"
      onclick="
      saveNote(${index})
      ">
        Сохранить
      </button>

    `,

    "openNotes()"

  );

}


function saveNote(index){

  const notes =
  JSON.parse(
    localStorage.getItem(
      "v41Notes"
    )
    ||
    "[]"
  );


  const note = {

    title:
    document
    .getElementById(
      "noteTitle"
    )
    .value,

    text:
    document
    .getElementById(
      "noteText"
    )
    .value

  };


  if(index>=0){

    notes[index] =
    note;

  }else{

    notes.unshift(note);

  }


  localStorage.setItem(
    "v41Notes",
    JSON.stringify(notes)
  );


  openNotes();

}

function openCalculator(){

  const buttons = [

        readonly

        style="

        background:#111;
        color:#fff;
        text-align:right;
        font-size:38px;

        style="
        display:grid;
        grid-template-columns:
        repeat(4,1fr);
        gap:9px;
        ">

          ${buttons}

        </div>

      </div>

    `

  );

}


function calculatorPress(value){

  const display =
  document
  .getElementById(
    "calculatorDisplay"
  );


  if(value==="C"){

    display.value =
    "";

    return;
  }


  if(value==="="){

    try{

      const expression =
      display.value

      .replaceAll(
        "×",
        "*"
      )

      .replaceAll(
        "÷",
        "/"
      )

      .replaceAll(
        "−",
        "-"
      );


      display.value =
      Function(
        `"use strict";return (${expression})`
      )();

    }catch(e){

      display.value =
      "Ошибка";

    }


    return;

  }


  display.value +=
  value;

}

/* =========================================================
   SEARCH
========================================================= */

function openSearch(){

  const overlay =
  document
  .getElementById(
    "searchOverlay"
  );


  overlay.innerHTML = `

    <div class="search-line">

      <input
      class="search-input"
      id="searchInput"
      placeholder="Поиск"
      oninput="runSearch()">


      <button
      class="search-cancel"
      onclick="closeSearch()">
        Отмена
      </button>

    </div>


    <div
    class="search-results"
    id="searchResults">
    </div>

  `;


  overlay.classList.add(
    "show"
  );


  setTimeout(
    ()=>{

      document
      .getElementById(
        "searchInput"
      )
      ?.focus();

    },
    120
  );


  runSearch();

}


function runSearch(){

  const input =
  document
  .getElementById(
    "searchInput"
  );


  if(!input){
    return;
  }


  const query =
  input.value
  .toLowerCase()
  .trim();


  const results =
  state.apps.filter(
    app=>
    !query
    ||
    app.title
    .toLowerCase()
    .includes(query)
  );


  const box =
  document
  .getElementById(
    "searchResults"
  );


  box.innerHTML =
  results.map(
    app=>`

      <div
      class="search-item"
      onclick="
      closeSearch();
      launchAppById('${app.id}')
      ">

        ${iconHTML(app)}

        <div>
          ${safe(app.title)}
        </div>

      </div>

    `
  ).join("");


  hydrateImages();

}


function launchAppById(id){

  const app =
  state.apps.find(
    item=>
    item.id === id
  );


  if(app){
    openApp(app);
  }

}


function closeSearch(){

  const overlay =
  document
  .getElementById(
    "searchOverlay"
  );


  overlay.classList.remove(
    "show"
  );


  overlay.innerHTML =
  "";

}


/* =========================================================
   SAFE HTML
========================================================= */

function safe(text){

  return String(
    text ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function attr(text){

  return safe(text)
  .replaceAll(
    "`",
    "&#096;"
  );

}
